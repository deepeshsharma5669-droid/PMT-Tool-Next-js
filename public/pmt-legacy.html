                        ${readOnly ? '<i class="fa-solid fa-check text-emerald-400"></i>' : reviewLocked ? '<i class="fa-solid fa-lock text-purple-400"></i>' : '<i class="fa-solid fa-bars text-sm"></i>'}
                        ${(!readOnly && !reviewLocked) ? `<span class="font-bold text-slate-400 text-sm">${orderNum}</span>` : ''}
                    </div>
                    <div class="flex-1 min-w-0 px-3 flex flex-col justify-center cursor-pointer" onclick="openTaskDetailModal('${task.id}')">
                        <div class="flex items-center gap-2">
                            <h4 class="font-bold text-slate-800 text-sm truncate hover:text-primary-600 transition-colors">${task.title}</h4>
                            ${task.isClientChange ? `<span class="text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-bold">Client Change · Rev ${task.clientRevision}</span>` : ''}
                        </div>
                        ${task.isClientChange && task.status === 'CHANGES_REQUIRED' ? `<div class="text-[10px] text-amber-600 font-bold mt-0.5"><i class="fa-solid fa-rotate-left mr-1"></i>Client Rework</div>` : ''}
                    </div>
                    <div class="w-32 shrink-0 flex items-center gap-2">
                        <img src="${assignee.avatar}" class="w-6 h-6 rounded-full ring-1 ring-slate-200">
                        <span class="text-xs font-medium text-slate-600 truncate">${assignee.name.split(' ')[0]}</span>
                    </div>
                    <div class="w-28 shrink-0">
                         <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider border
                            ${task.status==='TODO'?'bg-slate-50 text-slate-600 border-slate-200':
                              task.status==='IN_PROGRESS'?'bg-blue-50 text-blue-700 border-blue-200':
                              task.status==='IN_REVIEW'?'bg-purple-50 text-purple-700 border-purple-200':
                              task.status==='CHANGES_REQUIRED'?'bg-red-50 text-red-700 border-red-200':
                              'bg-emerald-50 text-emerald-700 border-emerald-200'}">
                            ${statusLabels[task.status] || task.status}
                        </span>
                    </div>
                    <div class="w-24 shrink-0 pr-2">
                        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded border ${prio.color}">${prio.label}</span>
                    </div>
                    <div class="w-24 shrink-0 text-xs text-slate-500 font-medium">
                        <i class="fa-regular fa-calendar mr-1"></i>${task.deadline.slice(5)}
                    </div>
                    ${readOnly ? '<div class="w-8 shrink-0 flex items-center justify-end"><button onclick="openTaskDetailModal(\''+task.id+'\')" class="text-slate-400 hover:text-primary-600"><i class="fa-solid fa-eye"></i></button></div>' :
                      reviewLocked ? `<div class="w-auto shrink-0 flex items-center justify-end"><button onclick="openReviewSubmissionModal('${task.id}')" class="px-3 py-1.5 bg-primary-50 text-primary-700 border border-primary-200 rounded-lg text-[11px] font-bold hover:bg-primary-100 transition whitespace-nowrap">Review Submission</button></div>` : `
                    <div class="w-8 shrink-0 flex items-center justify-end">
                        <button onclick="openEditTaskModal('${task.id}')" class="w-8 h-8 rounded hover:bg-slate-100 flex items-center justify-center transition-colors text-slate-400">
                            <i class="fa-solid fa-ellipsis-vertical"></i>
                        </button>
                    </div>`}
                </div>
            `;
        }

        function renderMemberBoard() {
            const user = AppState.currentUser;
            let myTasks = DB.tasks.filter(t => t.assigneeId === user.id);
            
            if (AppState.searchQuery) {
                const q = AppState.searchQuery.toLowerCase();
                myTasks = myTasks.filter(t => t.title.toLowerCase().includes(q));
            }
            if (AppState.filterStatus && AppState.filterStatus !== 'ALL') {
                if (AppState.filterStatus === 'DUE_TODAY') {
                    const todayStr = new Date().toISOString().split('T')[0];
                    myTasks = myTasks.filter(t => t.deadline === todayStr && t.status !== 'APPROVED');
                } else if (AppState.filterStatus === 'OVERDUE') {
                    const todayStr = new Date().toISOString().split('T')[0];
                    myTasks = myTasks.filter(t => t.deadline < todayStr && t.status !== 'APPROVED');
                } else {
                    myTasks = myTasks.filter(t => t.status === AppState.filterStatus);
                }
            }

            return `
                <div class="flex flex-col h-full">
                    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-6 shrink-0">
                        <div>
                            <h1 class="text-2xl font-bold text-slate-900 mb-1">My Work</h1>
                            <p class="text-slate-500 text-sm">Drag and drop tasks to update status.</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="relative">
                                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                                <input type="text" placeholder="Search tasks..." value="${AppState.searchQuery}" oninput="AppState.searchQuery=this.value; document.getElementById('main-content').innerHTML=renderCurrentView();" class="pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm w-48 focus:border-primary-500 outline-none">
                            </div>
                            <select onchange="AppState.filterStatus=this.value; document.getElementById('main-content').innerHTML=renderCurrentView();" class="border border-slate-300 rounded-lg p-2 text-sm outline-none focus:border-primary-500">
                                <option value="ALL" ${AppState.filterStatus==='ALL'?'selected':''}>All Tasks</option>
                                <option value="DUE_TODAY" ${AppState.filterStatus==='DUE_TODAY'?'selected':''}>Due Today</option>
                                <option value="OVERDUE" ${AppState.filterStatus==='OVERDUE'?'selected':''}>Overdue</option>
                                <option value="CHANGES_REQUIRED" ${AppState.filterStatus==='CHANGES_REQUIRED'?'selected':''}>Changes Required</option>
                                <option value="IN_REVIEW" ${AppState.filterStatus==='IN_REVIEW'?'selected':''}>In Review</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex-1 overflow-x-auto pb-4">
                        <div class="flex gap-4 h-full min-w-max">
                            ${renderKanbanColumn('TODO', 'To Do', myTasks.filter(t=>t.status==='TODO'), 'bg-slate-100/50')}
                            ${renderKanbanColumn('IN_PROGRESS', 'In Progress', myTasks.filter(t=>t.status==='IN_PROGRESS'), 'bg-blue-50/50')}
                            ${renderKanbanColumn('IN_REVIEW', 'In Review', myTasks.filter(t=>t.status==='IN_REVIEW'), 'bg-purple-50/50')}
                            ${renderKanbanColumn('CHANGES_REQUIRED', 'Changes Required', myTasks.filter(t=>t.status==='CHANGES_REQUIRED'), 'bg-red-50/50')}
                            ${renderKanbanColumn('APPROVED', 'Approved', myTasks.filter(t=>t.status==='APPROVED'), 'bg-emerald-50/50')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderKanbanColumn(statusId, title, tasks, bgClass) {
            const isLocked = statusId === 'IN_REVIEW' || statusId === 'APPROVED';
            return `
                <div class="w-[300px] flex flex-col ${bgClass} rounded-xl border border-slate-200/60 overflow-hidden">
                    <div class="px-4 py-3 border-b border-slate-200/60 flex justify-between items-center bg-white/50 backdrop-blur-sm">
                        <h3 class="font-bold text-slate-700 text-sm uppercase tracking-wider flex items-center gap-2">${title} ${isLocked ? '<i class="fa-solid fa-lock text-slate-400"></i>' : ''}</h3>
                        <span class="bg-white text-slate-500 text-xs font-bold px-2 py-0.5 rounded-full border border-slate-200 shadow-sm">${tasks.length}</span>
                    </div>
                    <div class="p-3 flex-1 overflow-y-auto kanban-column flex flex-col gap-3" ondragover="kanbanDragOver(event)" ondrop="kanbanDrop(event, '${statusId}')" ondragenter="kanbanDragEnter(event)" ondragleave="kanbanDragLeave(event)">
                        ${tasks.map(t => renderKanbanCard(t)).join('')}
                    </div>
                </div>
            `;
        }

        function renderKanbanCard(task) {
            const stage = getStage(task.stageId);
            const deliv = getDeliverable(stage.deliverableId);
            const camp = getCampaign(deliv.campaignId);
            const prio = getTaskPriority(task.id);
            
            let alertBadge = '';
            if (task.isClientChange && task.status === 'CHANGES_REQUIRED') {
                alertBadge = `<div class="mb-2 text-xs font-bold text-amber-700 bg-amber-50 px-2 py-1 rounded border border-amber-200 flex items-center gap-1 w-max"><i class="fa-solid fa-rotate-left"></i> Client Changes</div>`;
            } else if (task.status === 'CHANGES_REQUIRED') {
                alertBadge = `<div class="mb-2 text-xs font-bold text-red-600 bg-red-50 px-2 py-1 rounded border border-red-100 flex items-center gap-1 w-max"><i class="fa-solid fa-circle-exclamation"></i> Internal Changes</div>`;
            }

            const isLocked = task.status === 'IN_REVIEW' || task.status === 'APPROVED';
            const draggableAttr = isLocked ? '' : 'draggable="true" ondragstart="kanbanDragStart(event, \'' + task.id + '\')"';
            const cursorClass = isLocked ? 'cursor-pointer opacity-80' : 'cursor-grab active:cursor-grabbing hover:shadow-md';

            return `
                <div class="task-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm transition-shadow ${cursorClass}" ${draggableAttr} onclick="openTaskDetailModal('${task.id}')">
                    ${alertBadge}
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border ${prio.color}">${prio.label}</span>
                    </div>
                    <h4 class="font-bold text-slate-800 mb-1 leading-tight">${task.title}</h4>
                    <p class="text-[11px] text-slate-500 mb-3 truncate leading-snug">
                        <span class="font-semibold text-slate-700">${deliv.name}</span>${task.isClientChange ? ` <span class="text-amber-600 font-bold ml-1">· Client Change · Rev ${task.clientRevision}</span>` : ''}<br>
                        <span class="text-slate-400">${camp.name} • ${stage.name}</span>
                    </p>
                    <div class="flex justify-between items-center border-t border-slate-100 pt-3 mt-1">
                        <div class="text-xs font-medium text-slate-500 flex items-center gap-1"><i class="fa-regular fa-calendar"></i> ${task.deadline.slice(5)}</div>
                    </div>
                </div>
            `;
        }

        let draggedKanbanTaskId = null;
        function kanbanDragStart(ev, taskId) { draggedKanbanTaskId = taskId; ev.dataTransfer.effectAllowed = 'move'; setTimeout(() => ev.target.style.opacity = '0.5', 0); }
        function kanbanDragOver(ev) { ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; }
        function kanbanDragEnter(ev) { ev.preventDefault(); if(ev.target.classList.contains('kanban-column')) ev.target.classList.add('drag-over'); }
        function kanbanDragLeave(ev) { if(ev.target.classList.contains('kanban-column')) ev.target.classList.remove('drag-over'); }
        
        function kanbanDrop(ev, newStatus) {
            ev.preventDefault();
            document.querySelectorAll('.kanban-column').forEach(el => el.classList.remove('drag-over'));
            
            if (draggedKanbanTaskId) {
                const task = DB.tasks.find(t => t.id === draggedKanbanTaskId);
                const oldStatus = task.status;
                let valid = true;
                
                if (AppState.currentUser.role === 'MEMBER') {
                    if (newStatus === 'APPROVED') { valid = false; showToast('Move not allowed — Only Managers can approve tasks.', 'error'); }
                    if (oldStatus === 'IN_REVIEW') { valid = false; showToast('Task is locked in review.', 'error'); }
                    if (oldStatus === 'APPROVED') { valid = false; showToast('Task is completed and locked.', 'error'); }
                    if (newStatus === 'IN_REVIEW' && oldStatus === 'IN_PROGRESS') {
                        valid = false;
                        showToast("Move not allowed — use 'Submit for Review' inside the task to upload your work.", 'error');
                    }
                    if (newStatus === 'CHANGES_REQUIRED') {
                        valid = false;
                        showToast('Move not allowed — you cannot assign changes to yourself.', 'error');
                    }
                    if (oldStatus === 'TODO' && newStatus !== 'IN_PROGRESS') {
                        valid = false;
                        showToast('Move not allowed — tasks must enter In Progress first.', 'error');
                    }
                    if (oldStatus === 'CHANGES_REQUIRED' && newStatus !== 'IN_PROGRESS') {
                        valid = false;
                        showToast('Move not allowed — tasks must enter In Progress first.', 'error');
                    }
                    if (oldStatus === 'IN_PROGRESS' && newStatus === 'TODO') {
                        valid = false;
                        showToast('Move not allowed — use the available task action.', 'error');
                    }
                }

                if (valid && oldStatus !== newStatus) {
                    task.status = newStatus;
                    task.lastUpdatedAt = new Date().toISOString();
                    if(newStatus === 'IN_PROGRESS' && !task.startedAt) task.startedAt = task.lastUpdatedAt;
                    sb.from('pmt_tasks').update({ status: newStatus }).eq('id', task.id);
                    
                    logActivity('TASK', task.id, `Moved task to ${newStatus.replace('_', ' ')}`);
                    showToast(`Moved to ${newStatus.replace('_', ' ')}`);
                }
                draggedKanbanTaskId = null;
                navigateTo(AppState.currentView);
            }
        }

        function renderApprovals() {
            const isManager = AppState.currentUser.role === 'MANAGER';
            const dept = AppState.currentUser.dept;
            
            let reviewTasks = DB.tasks.filter(t => t.status === 'IN_REVIEW');
            let readyStages = DB.stages.filter(s => s.status === 'CLIENT_DECISION');
            
            if (AppState.searchQuery) {
                const q = AppState.searchQuery.toLowerCase();
                reviewTasks = reviewTasks.filter(t => t.title.toLowerCase().includes(q) || getDeliverable(getStage(t.stageId).deliverableId).name.toLowerCase().includes(q));
                readyStages = readyStages.filter(s => getDeliverable(s.deliverableId).name.toLowerCase().includes(q));
            }

            if (isManager) {
                const deptStageIds = DB.stages.filter(s => s.dept === dept).map(s => s.id);
                reviewTasks = reviewTasks.filter(t => deptStageIds.includes(t.stageId));
                readyStages = readyStages.filter(s => s.dept === dept);
            }

            return `
                <div class="max-w-5xl mx-auto">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                        <h1 class="text-2xl font-bold text-slate-900">Approvals</h1>
                        <div class="relative">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input type="text" placeholder="Search approvals..." value="${AppState.searchQuery}" oninput="AppState.searchQuery=this.value; document.getElementById('main-content').innerHTML=renderCurrentView();" class="pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm w-64 focus:border-primary-500 outline-none">
                        </div>
                    </div>
                    
                    <div class="mb-10">
                        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-eye text-purple-500"></i> Gate 1: Internal Task Review</h2>
                        ${reviewTasks.length === 0 ? '<div class="p-8 bg-white border border-slate-200 border-dashed rounded-xl text-center text-slate-500 font-medium shadow-sm">No tasks await internal review.</div>' : `
                            <div class="flex flex-col gap-3">
                                ${reviewTasks.map(t => {
                                    const stage = getStage(t.stageId);
                                    const deliv = getDeliverable(stage.deliverableId);
                                    const camp = getCampaign(deliv.campaignId);
                                    const assignee = getUser(t.assigneeId);
                                    const sub = getLatestSubmission(t);
                                    return `
                                        <div class="bg-white border border-slate-200 rounded-xl p-4 flex items-center justify-between shadow-sm">
                                            <div class="flex items-center gap-4">
                                                <img src="${assignee.avatar}" class="w-10 h-10 rounded-full ring-2 ring-slate-100">
                                                <div>
                                                    <div class="flex items-center gap-2">
                                                        <h4 class="font-bold text-slate-800">${t.title}</h4>
                                                        ${t.isClientChange ? `<span class="text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-bold">Client Change · Rev ${t.clientRevision}</span>` : ''}
                                                        ${sub ? `<span class="text-[10px] bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded font-bold">${sub.options.length} option${sub.options.length > 1 ? 's' : ''} submitted</span>` : ''}
                                                    </div>
                                                    <div class="text-sm text-slate-500 mt-0.5">${deliv.name} > ${stage.name} · Submitted by ${assignee.name.split(' ')[0]}</div>
                                                </div>
                                            </div>
                                            <button onclick="openReviewSubmissionModal('${t.id}')" class="px-4 py-2 bg-primary-600 text-white rounded-lg text-sm font-medium hover:bg-primary-700 transition shrink-0">Review Submission</button>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `}
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-shield-check text-blue-500"></i> Gate 2: Deliverable Review</h2>
                        ${readyStages.length === 0 ? '<div class="p-8 bg-white border border-slate-200 border-dashed rounded-xl text-center text-slate-500 font-medium shadow-sm">No deliverables are ready for a client decision right now.</div>' : `
                            <div class="flex flex-col gap-3">
                                ${readyStages.map(s => {
                                    const deliv = getDeliverable(s.deliverableId);
                                    const camp = getCampaign(deliv.campaignId);
                                    const client = getClient(camp.clientId);
                                    const gi = stageGateInfo(s);
                                    const countLabel = gi.isRevisionCycle ? `${gi.approved} / ${gi.total} change tasks approved` : `${gi.approved} / ${gi.total} tasks approved`;
                                    return `
                                        <div class="bg-white border border-blue-200 rounded-xl p-5 shadow-sm">
                                            <div class="grid grid-cols-2 gap-x-6 gap-y-1 text-sm mb-4">
                                                <div><span class="text-slate-500 font-semibold">Client:</span> <span class="font-bold text-slate-800">${client.name}</span></div>
                                                <div><span class="text-slate-500 font-semibold">Campaign:</span> <span class="font-bold text-slate-800">${camp.name}</span></div>
                                                <div><span class="text-slate-500 font-semibold">Deliverable:</span> <span class="font-bold text-slate-800">${deliv.name}</span></div>
                                                ${gi.isRevisionCycle ? `<div><span class="text-slate-500 font-semibold">Current Client Revision:</span> <span class="font-bold text-slate-800">${deliv.clientRevision}</span></div>` : ''}
                                            </div>
                                            <div class="flex items-center justify-between border-t border-slate-100 pt-3 flex-wrap gap-2">
                                                <div>
                                                    <span class="inline-flex items-center gap-2 text-blue-700 font-bold text-sm"><i class="fa-solid fa-shield-check"></i> Ready for Client Decision</span>
                                                    <div class="text-xs text-slate-500 font-semibold mt-1">${countLabel}</div>
                                                </div>
                                                <div class="flex gap-2">
                                                    ${AppState.currentUser.role === 'ADMIN' ? `
                                                        <button onclick="openRecordClientChangesModal('${s.id}')" class="px-4 py-2 bg-white text-blue-900 border border-blue-300 rounded-lg shadow-sm text-sm font-semibold hover:bg-blue-50 transition">Client Requested Changes</button>
                                                        <button onclick="openRecordClientApprovalModal('${s.id}')" class="px-4 py-2 bg-emerald-600 text-white rounded-lg shadow-sm text-sm font-semibold hover:bg-emerald-700 transition">Client Approved</button>
                                                    ` : `
                                                        <span class="px-3 py-2 rounded-lg bg-emerald-50 border border-emerald-200 text-xs font-semibold text-emerald-700">Sent to Admin for client approval</span>
                                                    `}
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        /** Chronological, read-only history of every submission on a task —
         *  options never get overwritten, each round just adds a new entry.
         *  No revision/iteration numbers on submissions themselves — that
         *  concept belongs only to the Deliverable's clientRevision. */
        function renderSubmissionHistory(task) {
            if (!task.submissions || task.submissions.length === 0) return '';
            const decisionLabel = { APPROVED: 'Approved', CHANGES_REQUESTED: 'Changes Requested', REJECTED_ALL: 'Rejected All' };
            const rows = task.submissions.map((sub, i) => {
                const isLatest = i === task.submissions.length - 1;
                const submitter = getUser(sub.submittedBy);
                const optsHtml = sub.options.map(o => `
                    <div class="flex items-center justify-between py-1.5 text-sm">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="${o.decision === 'SELECTED' ? 'text-emerald-600' : o.decision === 'REJECTED' ? 'text-slate-400' : 'text-slate-500'}">
                                <i class="fa-solid ${o.decision === 'SELECTED' ? 'fa-circle-check' : o.decision === 'REJECTED' ? 'fa-circle-xmark' : 'fa-circle-dot'}"></i>
                            </span>
                            <span class="font-medium text-slate-700 truncate">${o.name}</span>
                            ${o.note ? `<span class="text-slate-400 text-xs truncate">— ${o.note}</span>` : ''}
                        </div>
                        <a href="${o.link}" target="_blank" rel="noopener" class="text-xs font-bold text-primary-600 hover:text-primary-700 shrink-0 ml-3">Open File</a>
                    </div>
                `).join('');
                return `
                    <div class="border border-slate-200 rounded-xl p-4 ${isLatest ? 'bg-white' : 'bg-slate-50'}">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold text-slate-700 uppercase tracking-wide">${isLatest ? 'Latest Submission' : 'Submission'} — ${submitter ? submitter.name : 'Unknown'}</span>
                            <span class="text-[10px] text-slate-400">${sub.date}</span>
                        </div>
                        ${sub.note ? `<div class="text-xs text-slate-500 mb-2 italic">"${sub.note}"</div>` : ''}
                        ${optsHtml}
                        ${sub.decisionType ? `
                            <div class="mt-3 pt-3 border-t border-slate-200/70">
                                <div class="text-[10px] font-bold uppercase tracking-wide text-slate-500 mb-1">Manager — ${decisionLabel[sub.decisionType] || sub.decisionType}</div>
                                ${sub.managerFeedback ? `<p class="text-xs text-slate-600 whitespace-pre-wrap">"${sub.managerFeedback}"</p>` : ''}
                            </div>
                        ` : `<div class="mt-3 pt-3 border-t border-slate-200/70 text-[11px] text-slate-400 italic">Awaiting review</div>`}
                    </div>
                `;
            }).join('<div class="h-px"></div>');

            return `
                <div class="mt-6">
                    <h4 class="text-sm font-bold text-slate-800 mb-3">Submission History</h4>
                    <div class="flex flex-col gap-2">${rows}</div>
                </div>
            `;
        }

        function approveTask(taskId) {
            const task = DB.tasks.find(t => t.id === taskId);
            task.status = 'APPROVED';
            task.approvedAt = new Date().toISOString();
            sb.from('pmt_tasks').update({ status: 'APPROVED' }).eq('id', taskId);
            logActivity('TASK', task.id, 'Task internally approved');
            recalculateStageGate(getStage(task.stageId));
            showToast('Task internally approved.');
            navigateTo(AppState.currentView);
        }

        function openTaskDetailModal(taskId) {
            const task = DB.tasks.find(t => t.id === taskId);
            const stage = getStage(task.stageId);
            const deliv = getDeliverable(stage.deliverableId);
            const camp = getCampaign(deliv.campaignId);
            const assignee = getUser(task.assigneeId);
            const prio = getTaskPriority(task.id);
            const isMyTask = AppState.currentUser.id === task.assigneeId;

            let actionBtn = '';
            if (isMyTask) {
                if (task.status === 'TODO' || task.status === 'CHANGES_REQUIRED') {
                    actionBtn = `<button onclick="updateTaskStatus('${task.id}', 'IN_PROGRESS'); closeModals()" class="w-full py-3 bg-primary-600 text-white rounded-lg font-bold hover:bg-primary-700 transition shadow-sm">Start Work</button>`;
                } else if (task.status === 'IN_PROGRESS') {
                    actionBtn = `<button onclick="closeModals(); openSubmitForReviewModal('${task.id}')" class="w-full py-3 bg-purple-600 text-white rounded-lg font-bold hover:bg-purple-700 transition shadow-sm">Submit for Review</button>`;
                } else if (task.status === 'IN_REVIEW') {
                    actionBtn = `<div class="w-full py-3 bg-slate-100 text-slate-500 rounded-lg font-bold text-center border border-slate-200"><i class="fa-solid fa-lock mr-2"></i>Awaiting Manager Review</div>`;
                } else if (task.status === 'APPROVED') {
                    actionBtn = `<div class="w-full py-3 bg-emerald-50 text-emerald-600 rounded-lg font-bold text-center border border-emerald-200"><i class="fa-solid fa-check mr-2"></i>Approved</div>`;
                }
            } else if ((AppState.currentUser.role === 'MANAGER' || AppState.currentUser.role === 'ADMIN') && task.status === 'IN_REVIEW') {
                actionBtn = `<button onclick="closeModals(); openReviewSubmissionModal('${task.id}')" class="w-full py-3 bg-primary-600 text-white rounded-lg font-bold hover:bg-primary-700 transition shadow-sm">Review Submission</button>`;
            }

            let clientFeedbackBlock = '';
            if (task.isClientChange) {
                const feedbackForRev = (deliv.feedbackHistory || []).find(f => f.clientRevision === task.clientRevision);
                if (feedbackForRev) {
                    clientFeedbackBlock = `
                        <div class="mt-6 bg-amber-50 border border-amber-200 rounded-xl p-5 shadow-sm">
                            <div class="flex items-center justify-between mb-2 border-b border-amber-200/50 pb-2">
                                <h4 class="text-amber-900 font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-comment-dots text-amber-600"></i> Client Feedback</h4>
                                <span class="text-[10px] font-bold uppercase tracking-wider text-amber-700 bg-amber-200/50 px-2 py-0.5 rounded">Client Revision ${feedbackForRev.clientRevision}</span>
                            </div>
                            <p class="text-amber-900 text-sm whitespace-pre-wrap leading-relaxed mt-3">"${feedbackForRev.text}"</p>
                        </div>
                    `;
                }
            }

            let managerReviewBlock = '';
            if (task.status === 'CHANGES_REQUIRED' && task.managerFeedback) {
                const refs = task.preferredOptionRefs || [];
                managerReviewBlock = `
                    <div class="mt-4 bg-red-50 border border-red-200 rounded-xl p-4 shadow-sm">
                        <h4 class="text-red-800 font-bold text-sm mb-2 flex items-center gap-2"><i class="fa-solid fa-circle-exclamation text-red-600"></i> Manager Feedback</h4>
                        ${refs.length > 0 ? `<div class="text-xs font-bold text-red-700 mb-2">Selected references will be used as direction: ${refs.map(r => r.name).join(', ')}</div>` : `<div class="text-xs font-medium text-red-600/80 mb-2">No option retained — explore a new direction.</div>`}
                        <p class="text-red-700 text-sm whitespace-pre-wrap">${task.managerFeedback}</p>
                    </div>
                `;
            }

            const internalFeedbackBlock = task.feedback ? `
                <div class="mt-4 bg-red-50 border border-red-200 rounded-xl p-4 shadow-sm">
                    <h4 class="text-red-800 font-bold text-sm mb-2 flex items-center gap-2"><i class="fa-solid fa-circle-exclamation text-red-600"></i> Manager Internal Feedback</h4>
                    <p class="text-red-700 text-sm whitespace-pre-wrap">${task.feedback}</p>
                </div>
            ` : '';

            const historyBlock = renderSubmissionHistory(task);

            const taskActivity = DB.activity.filter(a => a.entityId === task.id).slice(0,5);
            const activityHtml = taskActivity.length ? `
                <div class="mt-6 border-t border-slate-200 pt-6">
                    <h4 class="text-sm font-bold text-slate-800 mb-4">Recent Activity</h4>
                    <div class="space-y-4">
                        ${taskActivity.map(a => `
                            <div class="flex gap-3 text-sm">
                                <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 shrink-0"><i class="fa-solid fa-history text-xs"></i></div>
                                <div>
                                    <div class="text-slate-700"><span class="font-semibold">${getUser(a.actorId).name.split(' ')[0]}</span> ${a.action}</div>
                                    <div class="text-[10px] text-slate-400 mt-0.5">${new Date(a.timestamp).toLocaleString()}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            ` : '';

            const html = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 flex items-center justify-center p-4" onclick="closeModals()">
                    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]" onclick="event.stopPropagation()">
                        <div class="flex justify-between items-start p-6 border-b border-slate-200 shrink-0">
                            <div>
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border ${prio.color}">${prio.label} Priority</span>
                                    ${task.isClientChange ? `
                                        <span class="text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-bold">Client Change</span>
                                        <span class="text-[10px] bg-slate-800 text-white px-1.5 py-0.5 rounded font-bold">Revision ${task.clientRevision}</span>
                                    ` : ''}
                                    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500 bg-slate-100 px-2 py-0.5 rounded">${task.status.replace('_', ' ')}</span>
                                </div>
                                <h2 class="text-2xl font-bold text-slate-900">${task.title}</h2>
                                <p class="text-sm font-medium text-slate-500 mt-1">${camp.name} > ${deliv.name} > ${stage.name}</p>
                            </div>
                            <button onclick="closeModals()" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="p-6 overflow-y-auto">
                            <div class="grid grid-cols-2 gap-6 mb-6">
                                <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 shadow-sm">
                                    <div class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-2">Assignee</div>
                                    <div class="flex items-center gap-3">
                                        <img src="${assignee.avatar}" class="w-8 h-8 rounded-full ring-2 ring-white">
                                        <span class="font-bold text-slate-800">${assignee.name}</span>
                                    </div>
                                </div>
                                <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 shadow-sm">
                                    <div class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-2">Deadline</div>
                                    <div class="flex items-center gap-2 font-bold ${task.deadline < new Date().toISOString().split('T')[0] && task.status !== 'APPROVED' ? 'text-red-600' : 'text-slate-800'}"><i class="fa-regular fa-calendar text-slate-400"></i> ${task.deadline}</div>
                                </div>
                            </div>
                            <h4 class="text-sm font-bold text-slate-800 mb-2">Task Description</h4>
                            <p class="text-sm text-slate-600 bg-white border border-slate-200 rounded-lg p-4 min-h-[80px] whitespace-pre-wrap shadow-sm">${task.desc || 'No description provided.'}</p>
                            
                            ${clientFeedbackBlock}
                            ${managerReviewBlock}
                            ${internalFeedbackBlock}
                            ${historyBlock}
                            ${activityHtml}
                        </div>
                        ${actionBtn ? `<div class="p-6 border-t border-slate-200 bg-slate-50 shrink-0">${actionBtn}</div>` : ''}
                    </div>
                </div>
            `;
            document.getElementById('modals').innerHTML = html;
        }

        let pendingSubmissionOptions = [];

        function openSubmitForReviewModal(taskId) {
            pendingSubmissionOptions = [{ name: '', link: '', note: '' }];
            renderSubmitForReviewModal(taskId);
        }

        function renderSubmitForReviewModal(taskId) {
            const task = DB.tasks.find(t => t.id === taskId);
            const stage = getStage(task.stageId);
            const deliv = getDeliverable(stage.deliverableId);

            const rows = pendingSubmissionOptions.map((opt, i) => `
                <div class="border border-slate-200 rounded-xl p-4 mb-3 bg-slate-50">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-bold text-slate-500 uppercase">Option ${i + 1}</span>
                        ${pendingSubmissionOptions.length > 1 ? `<button onclick="removeSubmissionOption(${i}, '${taskId}')" class="text-slate-400 hover:text-red-600 text-xs"><i class="fa-solid fa-trash"></i></button>` : ''}
                    </div>
                    <div class="flex flex-col gap-3">
                        <div><label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Option Name</label><input type="text" value="${opt.name}" oninput="pendingSubmissionOptions[${i}].name=this.value" placeholder="e.g. Variant A" class="w-full border border-slate-300 rounded-lg p-2 text-sm"></div>
                        <div><label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">File Link <span class="text-red-500">*</span></label><input type="text" value="${opt.link}" oninput="pendingSubmissionOptions[${i}].link=this.value" placeholder="https://figma.com/... or drive.google.com/..." class="w-full border border-slate-300 rounded-lg p-2 text-sm"></div>
                        <div><label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Optional note</label><input type="text" value="${opt.note}" oninput="pendingSubmissionOptions[${i}].note=this.value" class="w-full border border-slate-300 rounded-lg p-2 text-sm"></div>
                    </div>
                </div>
            `).join('');

            document.getElementById('modals').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl overflow-hidden flex flex-col max-h-[92vh]">
                        <div class="flex justify-between items-center p-6 border-b border-slate-200 shrink-0">
                            <div>
                                <h2 class="text-xl font-bold text-slate-900">Submit for Review</h2>
                                <p class="text-sm text-slate-500 mt-0.5">${task.title} — ${deliv.name} > ${stage.name}</p>
                            </div>
                            <button onclick="closeModals()" class="text-slate-400 hover:text-slate-800"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="p-6 overflow-y-auto bg-slate-50">
                            <p class="text-xs text-slate-500 font-medium mb-3">Add as many options as you want the Manager to look at.</p>
                            ${rows}
                            <button onclick="addSubmissionOption('${taskId}')" class="w-full py-2.5 border-2 border-dashed border-slate-300 rounded-xl text-slate-500 text-sm font-bold hover:border-primary-400 hover:text-primary-600 transition mb-4">+ Add Another Option</button>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Optional Submission Note</label>
                                <textarea id="sub-note" rows="2" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white"></textarea>
                            </div>
                        </div>
                        <div class="p-6 border-t border-slate-200 bg-white flex justify-end shrink-0">
                            <button onclick="submitTaskForReview('${taskId}')" class="px-5 py-2.5 bg-purple-600 text-white rounded-lg text-sm font-bold hover:bg-purple-700 transition shadow-sm">Submit for Review</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function addSubmissionOption(taskId) { pendingSubmissionOptions.push({ name: '', link: '', note: '' }); renderSubmitForReviewModal(taskId); }
        function removeSubmissionOption(idx, taskId) { pendingSubmissionOptions.splice(idx, 1); renderSubmitForReviewModal(taskId); }

        function submitTaskForReview(taskId) {
            const task = DB.tasks.find(t => t.id === taskId);
            if (AppState.currentUser.role !== 'MEMBER' || task.assigneeId !== AppState.currentUser.id) {
                showToast('You can only submit work on tasks assigned to you.', 'error');
                return;
            }
            const valid = pendingSubmissionOptions.filter(o => o.link.trim());
            if (valid.length === 0) { showToast('Add at least one option with a file link.', 'error'); return; }

            const noteEl = document.getElementById('sub-note');
            const submission = {
                id: generateId('sub'),
                submittedBy: task.assigneeId,
                note: noteEl.value.trim() || null,
                date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
                options: valid.map((o, i) => ({
                    id: generateId('opt'), name: o.name.trim() || `Option ${i + 1}`, link: o.link.trim(), note: o.note.trim() || null, decision: 'PENDING',
                })),
                managerFeedback: null, decisionType: null,
            };
            if (!task.submissions) task.submissions = [];
            task.submissions.push(submission);
            task.status = 'IN_REVIEW';
            task.submittedAt = new Date().toISOString();
            sb.from('pmt_tasks').update({ status: 'IN_REVIEW' }).eq('id', taskId);

            logActivity('TASK', taskId, 'Submitted task for review');
            const submittedStage = getStage(task.stageId);
            const stageManagers = DB.users.filter(u => u.role === 'MANAGER' && u.dept === submittedStage.dept);
            stageManagers.forEach(mgr => {
                createNotification(mgr.id, 'SUBMISSION_RECEIVED', `${getUser(task.assigneeId).name} submitted options for ${task.title}`, `navigateTo('approvals')`);
            });
            
            closeModals();
            showToast('Submitted for review.');
            navigateTo(AppState.currentView);
        }

        function updateTaskStatus(taskId, status) {
            const task = DB.tasks.find(t => t.id === taskId);
            if (AppState.currentUser.role !== 'MEMBER' || task.assigneeId !== AppState.currentUser.id) {
                showToast('You can only work on tasks assigned to you.', 'error');
                return;
            }
            task.status = status;
            task.lastUpdatedAt = new Date().toISOString();
            if(status === 'IN_PROGRESS' && !task.startedAt) task.startedAt = task.lastUpdatedAt;
            sb.from('pmt_tasks').update({ status: status }).eq('id', taskId);
            logActivity('TASK', taskId, `Started work on task`);
            showToast(`Task moved to ${status.replace('_', ' ')}`);
            navigateTo(AppState.currentView);
        }

        function openReviewSubmissionModal(taskId) {
            const task = DB.tasks.find(t => t.id === taskId);
            const stage = getStage(task.stageId);
            const deliv = getDeliverable(stage.deliverableId);
            const camp = getCampaign(deliv.campaignId);
            const assignee = getUser(task.assigneeId);
            const sub = getLatestSubmission(task);

            if (!sub) return;

            const optionsHtml = sub.options.map(o => `
                <div class="border border-slate-200 rounded-xl p-4 mb-3 ${o.decision === 'SELECTED' ? 'bg-emerald-50 border-emerald-300' : o.decision === 'REJECTED' ? 'bg-slate-50 opacity-70' : 'bg-white'}">
                    <div class="flex justify-between items-start gap-3">
                        <div class="min-w-0">
                            <div class="font-bold text-slate-800">${o.name}</div>
                            ${o.note ? `<div class="text-xs text-slate-500 mt-1">${o.note}</div>` : ''}
                            <a href="${o.link}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-xs font-bold text-primary-600 hover:text-primary-700 mt-2"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open File</a>
                        </div>
                        <div class="text-right shrink-0">
                            ${o.decision === 'SELECTED' ? '<div class="text-emerald-700 text-xs font-bold mb-2 flex items-center gap-1 justify-end"><i class="fa-solid fa-circle-check"></i> Selected</div>' : ''}
                            ${o.decision === 'REJECTED' ? '<div class="text-slate-500 text-xs font-bold mb-2 flex items-center gap-1 justify-end"><i class="fa-solid fa-circle-xmark"></i> Rejected</div>' : ''}
                            <div class="flex gap-1.5">
                                ${o.decision !== 'SELECTED' ? `<button onclick="toggleOptionDecision('${task.id}','${o.id}','SELECTED')" class="px-2.5 py-1 bg-emerald-600 text-white rounded text-[11px] font-bold hover:bg-emerald-700 transition">Select</button>` : ''}
                                ${o.decision !== 'REJECTED' ? `<button onclick="toggleOptionDecision('${task.id}','${o.id}','REJECTED')" class="px-2.5 py-1 bg-white border border-slate-300 text-slate-600 rounded text-[11px] font-bold hover:bg-slate-50 transition">Reject</button>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            const selected = sub.options.filter(o => o.decision === 'SELECTED');

            document.getElementById('modals').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl overflow-hidden flex flex-col max-h-[92vh]">
                        <div class="flex justify-between items-start p-6 border-b border-slate-200 shrink-0">
                            <div>
                                <h2 class="text-xl font-bold text-slate-900">${task.title}</h2>
                                <p class="text-sm font-medium text-slate-500 mt-1">${camp.name} > ${deliv.name} > ${stage.name}</p>
                            </div>
                            <button onclick="closeModals()" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500 shrink-0"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="p-6 overflow-y-auto">
                            ${sub.note ? `<div class="mb-4 text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded-lg p-3"><span class="font-bold text-slate-700">Submission note:</span> ${sub.note}</div>` : ''}
                            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Submitted Options</h3>
                            ${optionsHtml}

                            <div class="mt-6 pt-5 border-t border-slate-200">
                                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Task Review</h3>
                                <div class="text-xs text-slate-600 mb-3">
                                    Selected references: ${selected.length ? selected.map(o => o.name).join(', ') : '<span class="text-slate-400">None yet</span>'}
                                </div>
                                <textarea id="mgr-review-feedback" placeholder="Feedback — required for Request Changes or Reject All, optional for approving" rows="3" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:border-primary-500 outline-none"></textarea>
                                <div id="review-feedback-error" class="hidden mt-1.5 text-xs font-bold text-red-600"></div>
                            </div>
                        </div>
                        <div class="p-6 border-t border-slate-200 bg-slate-50 flex flex-col sm:flex-row gap-2 shrink-0">
                            <button onclick="approveSelectedOption('${task.id}')" class="flex-1 px-4 py-2.5 bg-emerald-600 text-white rounded-lg text-sm font-bold hover:bg-emerald-700 transition">Approve Selected Option</button>
                            <button onclick="requestChangesOnSubmission('${task.id}')" class="flex-1 px-4 py-2.5 bg-amber-600 text-white rounded-lg text-sm font-bold hover:bg-amber-700 transition">Request Changes</button>
                            <button onclick="showConfirmModal('Reject All Options?', 'This will reject all variants and require new explorations. Continue?', 'Reject All', 'bg-red-600 hover:bg-red-700', 'rejectAllOptions(\\'${task.id}\\')')" class="flex-1 px-4 py-2.5 bg-white border border-slate-300 text-slate-700 rounded-lg text-sm font-bold hover:bg-slate-100 transition">Reject All</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleOptionDecision(taskId, optionId, decision) {
            const task = DB.tasks.find(t => t.id === taskId);
            const sub = getLatestSubmission(task);
            const option = sub.options.find(o => o.id === optionId);
            option.decision = decision;
            openReviewSubmissionModal(taskId);
        }

        /** Shared guard for the three review-decision actions (approve /
         *  request changes / reject all). A Manager may only decide on their
         *  own department's work, an Admin may decide on any, and the task
         *  must actually be IN_REVIEW - approving something that was never
         *  submitted (or was already decided) doesn't make sense. */
        function requireManagerReviewAccess(task) {
            const role = AppState.currentUser.role;
            if (role !== 'MANAGER' && role !== 'ADMIN') {
                showToast('Only a Manager or Admin can review submissions.', 'error');
                return false;
            }
            const stage = getStage(task.stageId);
            if (role === 'MANAGER' && stage.dept !== AppState.currentUser.dept) {
                showToast('You can only review submissions in your own department.', 'error');
                return false;
            }
            if (task.status !== 'IN_REVIEW') {
                showToast('This task is not currently awaiting review.', 'error');
                return false;
            }
            return true;
        }

        function approveSelectedOption(taskId) {
            const task = DB.tasks.find(t => t.id === taskId);
            if (!requireManagerReviewAccess(task)) return;
            const sub = getLatestSubmission(task);
            const selected = sub.options.filter(o => o.decision === 'SELECTED');
            if (selected.length === 0) {
                const err = document.getElementById('review-feedback-error');
                err.textContent = 'Select at least one option to approve.';
                err.classList.remove('hidden');
                return;
            }
            sub.options.forEach(o => { if (o.decision !== 'SELECTED') o.decision = 'REJECTED'; });
            sub.decisionType = 'APPROVED';
            sub.managerFeedback = document.getElementById('mgr-review-feedback').value.trim() || null;

            task.status = 'APPROVED';
            task.approvedAt = new Date().toISOString();
            task.preferredOptionRefs = selected.map(o => ({ submissionId: sub.id, optionId: o.id, name: o.name }));
            task.managerFeedback = sub.managerFeedback;
            sb.from('pmt_tasks').update({ status: 'APPROVED', feedback: sub.managerFeedback }).eq('id', task.id);
            
            logActivity('TASK', taskId, 'Approved submission');
            createNotification(task.assigneeId, 'TASK_APPROVED', `Your submission for ${task.title} was approved.`, `navigateTo('member-board')`);

            recalculateStageGate(getStage(task.stageId));
            closeModals();
            showToast('Task approved.');
            navigateTo(AppState.currentView);
        }

        function requestChangesOnSubmission(taskId) {
            const task = DB.tasks.find(t => t.id === taskId);
            if (!requireManagerReviewAccess(task)) return;
            const feedback = document.getElementById('mgr-review-feedback').value.trim();
            if (!feedback) {
                const err = document.getElementById('review-feedback-error');
                err.textContent = 'Feedback is required to request changes.';
                err.classList.remove('hidden');
                return;
            }
            const sub = getLatestSubmission(task);
            const selected = sub.options.filter(o => o.decision === 'SELECTED');
            sub.options.forEach(o => { if (o.decision !== 'SELECTED') o.decision = 'REJECTED'; });
            sub.decisionType = 'CHANGES_REQUESTED';
            sub.managerFeedback = feedback;

            task.status = 'CHANGES_REQUIRED';
            task.preferredOptionRefs = selected.map(o => ({ submissionId: sub.id, optionId: o.id, name: o.name }));
            task.managerFeedback = feedback;
            task.iteration = (task.iteration || 1) + 1;
            sb.from('pmt_tasks').update({ status: 'CHANGES_REQUIRED', feedback: feedback, iteration: task.iteration }).eq('id', task.id);

            logActivity('TASK', taskId, 'Requested changes on submission');
            createNotification(task.assigneeId, 'CHANGES_REQUESTED', `Changes requested for ${task.title}.`, `navigateTo('member-board')`);

            closeModals();
            showToast('Changes requested.');
            navigateTo(AppState.currentView);
        }

        function rejectAllOptions(taskId) {
            const task = DB.tasks.find(t => t.id === taskId);
            if (!requireManagerReviewAccess(task)) return;
            const feedback = document.getElementById('mgr-review-feedback').value.trim();
            if (!feedback) {
                const err = document.getElementById('review-feedback-error');
                err.textContent = 'Feedback is required to reject all options.';
                err.classList.remove('hidden');
                return;
            }
            const sub = getLatestSubmission(task);
            sub.options.forEach(o => { o.decision = 'REJECTED'; });
            sub.decisionType = 'REJECTED_ALL';
            sub.managerFeedback = feedback;

            task.status = 'CHANGES_REQUIRED';
            task.preferredOptionRefs = [];
            task.managerFeedback = feedback;
            task.iteration = (task.iteration || 1) + 1;
            sb.from('pmt_tasks').update({ status: 'CHANGES_REQUIRED', feedback: feedback, iteration: task.iteration }).eq('id', task.id);

            logActivity('TASK', taskId, 'Rejected all options');
            createNotification(task.assigneeId, 'CHANGES_REQUESTED', `All options rejected for ${task.title}.`, `navigateTo('member-board')`);

            showToast('All options rejected — feedback sent to Member.');

        /** Client decisions may only be recorded by an Admin, or the Manager
         *  who owns this stage's department - and only while the stage is
         *  actually sitting at CLIENT_DECISION. Recording a decision on a
         *  stage that isn't there yet (or already moved past it) doesn't
         *  correspond to anything real. */
        function requireClientDecisionAccess(stage) {
            const role = AppState.currentUser.role;
            if (role !== 'ADMIN' && !(role === 'MANAGER' && stage.dept === AppState.currentUser.dept)) {
                showToast('Only an Admin or the owning Manager can record a Client Decision.', 'error');
                return false;
            }
            if (stage.status !== 'CLIENT_DECISION') {
                showToast('This stage is not currently ready for a Client Decision.', 'error');
                return false;
            }
            return true;
        }

        function submitClientApproval(stageId) {
            const stage = getStage(stageId);
            if (!requireClientDecisionAccess(stage)) return;
            const channel = document.getElementById('ca-channel').value;
            if(!channel) { showToast('Communication Channel is required', 'error'); return; }

            const deliv = getDeliverable(stage.deliverableId);

            DB.clientDecisionHistory.push({
                id: generateId('cd'),
                deliverableId: deliv.id,
                decision: 'APPROVED',
                clientRevision: deliv.clientRevision,
                channel: channel,
                contactPerson: document.getElementById('ca-contact').value,
                notes: document.getElementById('ca-notes').value,
                recordedBy: AppState.currentUser.id,
                recordedAt: new Date().toISOString()
            });

            closeModals();
            cascadeCompletion(stageId);
            logActivity('DELIVERABLE', deliv.id, `Client approved (Revision ${deliv.clientRevision})`);

            // Notify whoever's responsible for what happens next, plus Admin
            // for visibility - not a blanket broadcast to everyone.
            const freshStage = getStage(stageId);
            const nextDeptStage = DB.stages.find(s => s.deliverableId === deliv.id && s.status === 'ACTIVE' && s.id !== stageId);

        function submitClientChanges(stageId) {

            const feedback = document.getElementById('cc-feedback').value.trim();
            const channel = document.getElementById('cc-channel').value;
            const errorEl = document.getElementById('cc-error');
            
            if (!feedback || !channel) { errorEl.classList.remove('hidden'); return; }

            const deliv = getDeliverable(stage.deliverableId);

            DB.clientDecisionHistory.push({

                feedback: feedback, notes: document.getElementById('cc-notes').value.trim(),
                recordedBy: AppState.currentUser.id, recordedAt: new Date().toISOString()

            if (!deliv.feedbackHistory) deliv.feedbackHistory = [];

            });

            stage.status = 'ACTIVE';
            stage.reworkPending = true;
            deliv.status = 'CHANGES_REQUESTED';
            
            logActivity('DELIVERABLE', deliv.id, `Client requested changes (Rev ${deliv.clientRevision})`);

        let pendingChangeTasks = [];

            const stage = getStage(stageId);
            const deliv = getDeliverable(stage.deliverableId);
            const deptUsers = DB.users.filter(u => u.dept === stage.dept || u.dept === 'ALL');
            pendingChangeTasks.splice(idx, 1);
            const feedbackForRev = (deliv.feedbackHistory || []).find(f => f.clientRevision === deliv.clientRevision);
            renderCreateChangeTasksModal(stageId, deliv, feedbackForRev, deptUsers);
        }

        function submitChangeTasks(stageId) {
            const stage = getStage(stageId);
            const deliv = getDeliverable(stage.deliverableId);
            const role = AppState.currentUser.role;
            if (role !== 'MANAGER' && role !== 'ADMIN') {
                showToast('Only a Manager or Admin can create Change Tasks.', 'error'); return;
            }
            if (role === 'MANAGER' && stage.dept !== AppState.currentUser.dept) {
                showToast('You can only create Change Tasks in your own department.', 'error'); return;
            }
            if (deliv.clientRevision === 0 || deliv.status !== 'CHANGES_REQUESTED') {
                showToast('Change Tasks can only be created during an active Client Changes cycle.', 'error'); return;
            }

            const valid = pendingChangeTasks.filter(r => r.title.trim() && r.assigneeId && r.deadline);
            if (valid.length === 0) { showToast('Every task needs a title, assignee, and deadline.', 'error'); return; }
            if (valid.length !== pendingChangeTasks.length) { showToast('Some tasks are missing required fields — fill them in or remove the row.', 'error'); return; }

            const stageTasks = DB.tasks.filter(t => t.stageId === stageId);
            let nextOrder = stageTasks.length > 0 ? Math.max(...stageTasks.map(t => t.order)) + 1 : 1;

            const createdIds = [];
            valid.forEach(row => {
                const newId = generateId('t');
                createdIds.push(newId);
                DB.tasks.push({
                    id: newId,
                    stageId: stageId,
                    title: row.title,
                    desc: row.desc,
                    assigneeId: row.assigneeId,
                    deadline: row.deadline,
                    status: 'CHANGES_REQUIRED',
                    clientRevision: deliv.clientRevision,
                    order: nextOrder++,
                    isClientChange: true,
                    submissions: [],
                });
                logActivity('TASK', newId, `Created change task ${row.title} (Revision ${deliv.clientRevision})`);
                createNotification(row.assigneeId, 'TASK_ASSIGNED', `You were assigned a Client Change task: ${row.title}`, `navigateTo('member-board')`);
            });

            showToast(`${valid.length} change task${valid.length > 1 ? 's' : ''} created.`);

            navigateTo(AppState.currentView);

                DB.deliverables.push({

        function saveEditDeliverable(deliverableId) {
            const deliv = getDeliverable(deliverableId);
            const newName = document.getElementById('ed-name').value.trim();
            const errEl = document.getElementById('ed-error');
            if (!newName) { errEl.textContent = 'Deliverable name is required.'; errEl.classList.remove('hidden'); return; }
            const dup = DB.deliverables.some(d => d.id !== deliverableId && d.campaignId === deliv.campaignId && d.name.trim().toLowerCase() === newName.toLowerCase());
            if (dup) { errEl.textContent = 'Another deliverable in this campaign already has that name.'; errEl.classList.remove('hidden'); return; }

            deliv.name = newName;

            // The type <select> only exists in the DOM when this deliverable had
            // no production history at the moment the modal opened. Re-check here
            // too, defensively, in case anything changed in between.
            const typeEl = document.getElementById('ed-type');
            if (typeEl && typeEl.value !== deliv.type) {
                if (deliverableHasProductionHistory(deliverableId)) {
                    showToast('Deliverable type cannot be changed after production has started.', 'error');
                } else {
                    const oldStageIds = DB.stages.filter(s => s.deliverableId === deliverableId).map(s => s.id);
                    // No production history means any tasks here are still TODO
                    // with nothing real attached - they don't carry history worth
                    // keeping, and they'd otherwise be left pointing at a deleted stage.
                    DB.tasks = DB.tasks.filter(t => !oldStageIds.includes(t.stageId));
                    DB.stages = DB.stages.filter(s => s.deliverableId !== deliverableId);

                    deliv.type = typeEl.value;
                    deliv.clientRevision = 0;
                    deliv.feedbackHistory = [];
                    deliv.status = 'IN_PROGRESS';

                    const template = WORKFLOW_TEMPLATES[typeEl.value] || WORKFLOW_TEMPLATES['Static Poster'];
                    template.forEach((stageDef, index) => {
                        DB.stages.push({
                            id: generateId('s'), deliverableId: deliverableId,
                            name: stageDef.name, dept: stageDef.dept,
                            order: index + 1, status: index === 0 ? 'ACTIVE' : 'PENDING', reworkPending: false
                        });
                    });
                    logActivity('DELIVERABLE', deliv.id, `Changed type to ${typeEl.value} — workflow rebuilt`);
                }
            }

            logActivity('DELIVERABLE', deliv.id, `Edited deliverable ${deliv.name}`);
            showToast('Deliverable updated'); closeModals(); navigateTo(AppState.currentView);
        }

function saveIdeationBriefV13(cid,id){if(AppState.currentUser.role!=='ADMIN')return;const pn=document.getElementById('ideation-project-v13')?.value.trim(),reqEl=document.getElementById('ideation-req-v13'),req= sanitizeIdeationRichTextV13(reqEl?.innerHTML||'');if(!pn||!ideationRequirementsTextV13(req))return showToast('Project name and client requirements are required.','error');const resources=[];document.querySelectorAll('#ideation-resources-v13 .ideation-resource-row-v13').forEach(r=>{const name=r.querySelector('.ideation-name-v13')?.value.trim(),url=r.querySelector('.ideation-url-v13')?.value.trim(),f=r.dataset.fileName,et=r.querySelector('.ideation-type-v13')?.value,ev=r.querySelector('.ideation-value-v13')?.value;if(f)resources.push({name:name||f,type:'file',value:f});else if(url)resources.push({name:name||url,type:'url',value:url});else if(et&&ev)resources.push({name:name||ev,type:et,value:ev});});const arr=getIdeationBriefsV13(cid),idx=arr.findIndex((b,i)=>(b.id||`brief_${cid}_${i}`)===id);const nb={id,projectName:pn,requirements:req,resources,updatedAt:new Date().toISOString(),updatedBy:AppState.currentUser.id};if(idx>=0)arr[idx]=nb;else arr.push(nb);DB.ideationBriefs[cid]=arr;persistIdeationBriefs();closeModals();navigateTo(AppState.currentView);showToast(idx>=0?'Ideation Brief updated successfully.':'Ideation Brief added successfully.','success');}

function renderDelayedTasksV13(){const today=new Date();today.setHours(0,0,0,0);const delayed=DB.tasks.filter(t=>!['APPROVED','DONE','COMPLETED','CLIENT_APPROVED'].includes(t.status)&&t.deadline&&new Date(t.deadline+'T00:00:00')<today).map(t=>{const s=getStage(t.stageId),d=s?getDeliverable(s.deliverableId):null,c=d?getCampaign(d.campaignId):null,a=getUser(t.assigneeId);return {t,s,d,c,a};}).filter(x=>x.d&&x.c);return `<section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden mb-8"><div class="px-6 py-5 border-b flex justify-between"><div><h2 class="text-lg font-bold">Delayed Deliverables</h2><p class="text-xs text-slate-400 mt-1">Tasks past their deadline and still requiring action</p></div><span class="px-3 py-1.5 rounded-full bg-red-50 text-red-600 text-xs font-bold">${delayed.length} ${delayed.length===1?'Task':'Tasks'}</span></div><div class="p-5">${delayed.length?delayed.map(x=>{const late=Math.max(1,Math.ceil((today-new Date(x.t.deadline+'T00:00:00'))/86400000));return `<div class="rounded-xl border px-5 py-4 mb-3"><div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4"><div><div class="text-sm font-bold text-slate-800">${escapeHtmlV13(x.d.name)}</div><div class="text-sm text-slate-700 mt-1"><b>${escapeHtmlV13(x.c.name)}</b> <span class="text-slate-300">•</span> <b>${escapeHtmlV13(x.t.title)}</b></div><div class="flex gap-2 mt-3"><span class="px-2.5 py-1 rounded bg-slate-50 border text-[11px] font-bold">Department: ${x.s?.dept||'—'}</span><span class="px-2.5 py-1 rounded bg-slate-50 border text-[11px] font-bold">Assigned to: ${escapeHtmlV13(x.a?.name||'Unassigned')}</span></div></div><div class="flex items-center gap-4"><div class="text-right"><div class="text-sm font-bold text-red-500">${late} ${late===1?'day':'days'} overdue</div><div class="text-xs text-slate-400 mt-1">${x.t.deadline}</div></div><button onclick="navigateTo('deliverable-detail',{campaignId:'${x.c.id}',deliverableId:'${x.d.id}'})" class="px-3 py-2 rounded-lg bg-primary-600 text-white text-xs font-bold">Show Status</button></div></div></div>`}).join(''):`<div class="py-10 text-center text-sm text-slate-400">✓<div class="mt-2">No delayed deliverables. Everything is on schedule.</div></div>`}</div></section>`;}

// ---- Dashboard / routing overrides -------------------------------------------
function renderSidebar(){
    const role=AppState.currentUser.role,items=[];
    if(role==='ADMIN'||role==='MANAGER')items.push({id:'dashboard',icon:'fa-chart-pie',label:'Dashboard'},{id:'campaigns',icon:'fa-bullhorn',label:'Campaigns'},{id:'team',icon:'fa-users',label:'Team'},{id:'approvals',icon:'fa-check-double',label:'Approvals'});
    if(role==='ADMIN')items.push({id:'clients',icon:'fa-building',label:'Clients'});
    if(role==='MEMBER')items.push({id:'member-board',icon:'fa-trello',label:'My Work'});
    const ca=['campaigns','campaign-detail','deliverable-detail'].includes(AppState.currentView),cl=['clients','client-profile'].includes(AppState.currentView);
    return `<aside class="w-64 bg-brand text-slate-300 flex flex-col border-r border-slate-800 relative z-20 shrink-0"><div class="h-16 flex items-center px-6 border-b border-slate-800 bg-slate-900/50"><i class="fa-solid fa-layer-group text-primary-500 mr-3 text-xl"></i><span class="text-white font-bold">PMT<span class="text-slate-500 font-light ml-1">Prototype</span></span></div><div class="px-6 py-6 border-b border-slate-800"><div class="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-2">Role Switcher</div><select onchange="switchRole(this.value)" class="w-full bg-slate-800 border border-slate-700 text-sm rounded px-2 py-1.5 text-white">${DB.users.map(u=>`<option value="${u.id}" ${AppState.currentUser.id===u.id?'selected':''}>${u.name} - ${u.role}</option>`).join('')}</select></div><nav class="flex-1 py-4">${items.map(i=>`<a href="#" onclick="navigateTo('${i.id}')" class="flex items-center px-6 py-3 text-sm font-medium ${AppState.currentView===i.id||(i.id==='campaigns'&&ca)||(i.id==='clients'&&cl)?'bg-primary-900 text-primary-400 border-r-2 border-primary-500':'hover:bg-slate-800'}"><i class="fa-solid ${i.icon} w-5 mr-3 text-center"></i>${i.label}</a>`).join('')}</nav><div class="p-5 border-t border-slate-800"><div class="flex items-center gap-3"><img src="${AppState.currentUser.avatar}" class="w-10 h-10 rounded-full"><div><div class="text-white font-semibold text-sm">${AppState.currentUser.name.split(' ')[0]}</div><div class="text-xs text-slate-500">${AppState.currentUser.dept} Dept</div></div></div></div></aside>`;
}
function renderCurrentView(){switch(AppState.currentView){case'dashboard':return renderDashboardV13();case'campaigns':return renderCampaigns();case'campaign-detail':return renderCampaignDetail();case'deliverable-detail':return renderDeliverableDetail();case'member-board':return renderMemberBoard();case' approvals':return renderApprovals();case'approvals':return renderApprovals();case'clients':return renderClients();case'client-profile':return renderClientProfile();case'team':return renderTeamV13();default:return '<div class="p-8 text-center text-slate-500">View not implemented</div>';}}
function renderDashboardV13(){
    const user=AppState.currentUser,isAdmin=user.role==='ADMIN',isManager=user.role==='MANAGER',dept=user.dept;
    let actionItems=isAdmin?getActionNeededAdmin():isManager?getActionNeededManager(dept):getActionNeededMember(user.id);
    let kpiCards='';
    if(!user||user.role!=='MEMBER'){const m=getRealMetrics(isManager?dept:null);kpiCards=`<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"><div class="bg-white p-5 rounded-xl border"><div class="text-xs font-bold text-slate-500 uppercase mb-2">On-Time %</div><div class="text-3xl font-bold">${m.onTimePct}%</div></div><div class="bg-white p-5 rounded-xl border"><div class="text-xs font-bold text-slate-500 uppercase mb-2">Rework Rate</div><div class="text-3xl font-bold">${m.reworkRate}%</div></div><div class="bg-white p-5 rounded-xl border"><div class="text-xs font-bold text-slate-500 uppercase mb-2">Avg Review Time</div><div class="text-3xl font-bold">${m.avgReviewHrs}h</div></div><div class="bg-white p-5 rounded-xl border"><div class="text-xs font-bold text-slate-500 uppercase mb-2">Open Tasks</div><div class="text-3xl font-bold text-primary-600">${m.openTasks}</div></div></div>`;}
    else {const st=getMyStats(user.id);kpiCards=`<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"><div class="bg-white p-5 rounded-xl border"><div class="text-xs font-bold text-slate-500 uppercase mb-2">My Tasks</div><div class="text-3xl font-bold">${st.total}</div></div><div class="bg-white p-5 rounded-xl border"><div class="text-xs font-bold text-slate-500 uppercase mb-2">Approved</div><div class="text-3xl font-bold text-emerald-600">${st.approved}</div></div><div class="bg-white p-5 rounded-xl border"><div class="text-xs font-bold text-slate-500 uppercase mb-2">In Review</div><div class="text-3xl font-bold text-purple-600">${st.inReview}</div></div><div class="bg-white p-5 rounded-xl border"><div class="text-xs font-bold text-slate-500 uppercase mb-2">Changes Req</div><div class="text-3xl font-bold">${st.changesReq}</div></div></div>`;}
    let content='';
    if(isAdmin){content=`${renderCampaignProgressOverview()}${renderDelayedTasksV13()}${renderAdminActionsRequiredV13()}${renderAdminClientChangesPanelV13()}${renderClientFeedbackOverviewV13()}${renderTeamEfficiencyPanelV13()}`;}
    else if(isManager){const ids=new Set(DB.stages.filter(s=>s.dept===dept).map(s=>s.id)),pt=DB.tasks.filter(t=>ids.has(t.stageId));content=`${renderManagerClientChangeRequestsV13()}<section class="bg-white rounded-xl border shadow-sm overflow-hidden mb-8"><div class="px-6 py-5 border-b"><h2 class="text-lg font-bold">${dept} Pipeline</h2><p class="text-xs text-slate-400 mt-1">Active tasks by stage</p></div><div class="p-6">${renderPipelineBar(getPipelineData(pt))}</div></section>${renderClientFeedbackOverviewV13()}`;}
    else content=`<div class="mt-0 p-8 text-center text-slate-500 bg-white border rounded-xl">View your active assignments on the My Work board.</div>`;
    const headerIdeation=`<div class="absolute right-0 top-0 z-[70] w-[360px] max-w-[calc(100vw-2rem)]">${renderIdeationBriefV13(DB.campaigns[0]?.id,isAdmin)}</div>`;
    return `<div class="max-w-7xl mx-auto"><div class="mb-8 relative min-h-[76px]"><div class="pr-[390px]"><h1 class="text-2xl font-bold text-slate-900 mb-1">Welcome back, ${escapeHtmlV13(user.name.split(' ')[0])}</h1><p class="text-slate-500 text-sm">Here's what's happening in ${isAdmin?'the organization':isManager?`the ${dept} department`:'your work'} today.</p></div>${headerIdeation}</div>${kpiCards}${content}</div>`;
}
function renderTeamEfficiencyPanelV13(){const active=DB.campaigns.filter(c=>c.status==='ACTIVE');const rows=getEfficiencyDepartmentsV13().map(dept=>{const ss=DB.stages.filter(s=>s.dept===dept),ids=new Set(ss.map(s=>s.id)),ds=DB.deliverables.filter(d=>ss.some(s=>s.deliverableId===d.id)),campaigns=new Set(ds.map(d=>d.campaignId));const reworks=DB.tasks.filter(t=>ids.has(t.stageId)&&(t.isClientChange||t.status==='CHANGES_REQUIRED'||Number(t.clientRevision||0)>0)).length;return {dept,campaigns:active.filter(c=>campaigns.has(c.id)).length,deliverables:ds.filter(d=>active.some(c=>c.id===d.campaignId)).length,reworks};});return `<section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden mb-8"><div class="px-6 py-5 border-b"><h2 class="text-lg font-bold">Team Efficiency</h2><p class="text-xs text-slate-400 mt-1">Department workload and rework across active campaigns</p></div><table class="w-full text-left"><thead class="bg-slate-50 border-b"><tr><th class="px-6 py-4 text-sm text-slate-500">Department</th><th class="px-6 py-4 text-sm text-slate-500">Campaign</th><th class="px-6 py-4 text-sm text-slate-500">Deliverables</th><th class="px-6 py-4 text-sm text-slate-500">No. of Reworks</th></tr></thead><tbody>${rows.map(r=>`<tr class="border-b last:border-0"><td class="px-6 py-5 font-semibold">${r.dept}</td><td class="px-6 py-5 font-bold">${r.campaigns}</td><td class="px-6 py-5 font-bold">${r.deliverables}</td><td class="px-6 py-5 font-bold ${r.reworks?'text-red-600':'text-emerald-600'}">${r.reworks}</td></tr>`).join('')}</tbody></table></section>`;}


// Re-open the Admin client-decision gate after a manager finishes a revision cycle.
const recalculateStageGateV13Original = recalculateStageGate;
recalculateStageGate = function(stage){
    recalculateStageGateV13Original(stage);
    if(stage.status==='CLIENT_DECISION'){
        stage.sentToAdminForClientApproval = true;
        const d=getDeliverable(stage.deliverableId);
        DB.users.filter(u=>u.role==='ADMIN').forEach(a=>createNotification(a.id,'CLIENT_APPROVAL',`${d?.name||'Deliverable'} is ready for client approval.`,`navigateTo('dashboard')`));
    }
};

window.submitClientApproval = function(stageId){
    const stage=getStage(stageId); if(!requireClientDecisionAccessV13(stage)) return;
    const channel=document.getElementById('ca-channel')?.value;
    if(!channel){showToast('Communication Channel is required','error');return;}
    const d=getDeliverable(stage.deliverableId);
    DB.clientDecisionHistory.push({id:generateId('cd'),deliverableId:d.id,decision:'APPROVED',clientRevision:d.clientRevision||0,channel,contactPerson:document.getElementById('ca-contact')?.value||'',notes:document.getElementById('ca-notes')?.value||'',recordedBy:AppState.currentUser.id,recordedAt:new Date().toISOString()});
    const f=(d.feedbackHistory||[]).find(x=>x.clientRevision===d.clientRevision && !x.resolved);
    if(f){f.resolved=true;f.resolvedAt=new Date().toISOString().slice(0,10);f.resolvedBy=AppState.currentUser.name;}
    stage.clientChangesRecorded=false; stage.reworkPending=false; stage.clientApproved=true; stage.sentToAdminForClientApproval=false;
    closeModals(); cascadeCompletion(stageId); logActivity('DELIVERABLE',d.id,`Client approved (Revision ${d.clientRevision||0})`);
    showToast(`Client approved ${stage.dept} work.`,'success'); navigateTo('dashboard');
};
