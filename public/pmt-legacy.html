<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheFinPedia PMT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: '#0f172a',
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #334155; margin: 0; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .kanban-column { min-height: 200px; transition: background-color 0.2s ease; }
        .kanban-column.drag-over { background-color: #e2e8f0; border: 2px dashed #94a3b8; }
        .task-card { cursor: grab; }
        .task-card:active { cursor: grabbing; }
        .task-strip { transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease; }
        .task-strip-dragging { opacity: 0.4; }
        .task-strip-over { transform: scale(1.01); box-shadow: 0 0 0 2px #60a5fa; z-index: 10; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

        .toast-exit { animation: fadeOut 0.3s ease-out forwards; }

        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
/* v13 feature additions from 18.html (features only, not wholesale merge) */
.calc-modal-overlay{
    position:fixed; inset:0; z-index:9999; background:rgba(15,23,42,.48);
    display:flex; align-items:center; justify-content:center; padding:24px;
}
.calc-modal{
    width:min(1180px,96vw); max-height:92vh; overflow:auto; background:#fff;
    border-radius:18px; box-shadow:0 25px 70px rgba(15,23,42,.28);
}
.calc-modal-header{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:26px 30px 20px; border-bottom:1px solid #e2e8f0;
}
.calc-modal-header h2{margin:0;color:#0f172a;font-size:25px}
.calc-modal-header p{margin:5px 0 0;color:#64748b}
.calc-close{border:0;background:transparent;font-size:30px;color:#94a3b8;cursor:pointer}
.calc-section{padding:24px 30px;border-bottom:1px solid #e2e8f0}
.calc-section h3{margin:0 0 5px;color:#0f172a;font-size:19px}
.calc-muted{margin:0;color:#64748b}
.calc-scale{display:flex;justify-content:space-between;margin:25px 4px 7px;color:#64748b;font-size:12px}
.calc-bar-wrap{position:relative;height:82px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc;overflow:visible}
.calc-bar-availability{
    position:absolute;left:0;top:0;height:100%;border-radius:9px 0 0 9px;
    background:#dbeafe;border:1px solid #60a5fa;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#1d4ed8;z-index:1;
}
.calc-bar-core{
    position:absolute;top:0;height:100%;background:#d1fae5;border:1px solid #34d399;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#047857;z-index:2;box-sizing:border-box;
}
.calc-bar-availability strong,.calc-bar-core strong{font-size:15px}
.calc-bar-availability small,.calc-bar-core small{font-size:11px;margin-top:4px}
.calc-productivity-marker{position:absolute;top:-62px;transform:translateX(-50%);z-index:5}
.calc-productivity-marker span{display:block;background:#6d28d9;color:white;padding:9px 12px;border-radius:6px;font-weight:700;font-size:13px;white-space:nowrap}
.calc-productivity-marker i{display:block;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid #6d28d9;margin:0 auto}
.calc-productivity-marker::after{content:"";display:block;width:16px;height:16px;border-radius:50%;background:#6d28d9;margin:-1px auto 0;border:3px solid white}
.calc-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:35px}
.calc-legend div{display:flex;flex-direction:column;gap:4px}
.calc-legend b{color:#334155;font-size:14px}.calc-legend span{color:#64748b;font-size:12px}
.calc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
.calc-card{border:1px solid #e2e8f0;border-radius:12px;padding:18px;background:#fff}
.calc-card h4{margin:0 0 16px;color:#0f172a;font-size:15px}
.calc-card p{display:flex;justify-content:space-between;margin:9px 0;color:#64748b;font-size:13px}
.calc-card p b{color:#334155}
.calc-formula{margin-top:16px;padding:12px;background:#f8fafc;border-radius:8px;color:#334155;font-size:13px}
.calc-formula strong{color:#2563eb}
.calc-table{width:100%;border-collapse:collapse;font-size:12px}
.calc-table th,.calc-table td{text-align:left;padding:8px 5px;border-bottom:1px solid #e2e8f0}
.calc-table th{color:#64748b}.calc-table td{color:#334155}
.calc-note{margin-top:18px;padding:13px 15px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;color:#1e40af;font-size:12px}
@media(max-width:800px){
    .calc-grid,.calc-legend{grid-template-columns:1fr}
    .calc-modal-header,.calc-section{padding-left:18px;padding-right:18px}
    .calc-bar-core strong,.calc-bar-availability strong{font-size:11px}
    .calc-bar-core small,.calc-bar-availability small{font-size:9px}
}

<body>
    <div id="app" class="flex h-screen overflow-hidden"></div>
    <div id="modals"></div>
    <div id="confirm-modals"></div>
    <div id="toast-container" class="fixed bottom-4 right-4 z-[999] flex flex-col gap-2 pointer-events-none"></div>
    <div id="pipeline-tooltip" class="hidden fixed z-[100] w-80 max-w-[calc(100vw-32px)] bg-slate-900 text-white rounded-xl shadow-2xl border border-slate-700 p-4 pointer-events-none"></div>

    <script>
        const now = new Date().toISOString();
        const yesterday = new Date(Date.now() - 86400000).toISOString();

        const SUPABASE_URL = "https://bihjtbekxldabrmxjbnp.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpaGp0YmVreGxkYWJybXhqYm5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMDMzNTAsImV4cCI6MjEwMjc3OTM1MH0.ivgM9tSmbJx7PZPT-ZBBfiTG30RWZLAKVEwHrpcyAPw";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Core fields (users, clients, campaigns, deliverables, stages, tasks) are
        // now loaded live from Supabase in loadAllData(). Richer nested fields this
        // file also uses — submissions, feedbackHistory, activity, notifications,
        // clientDecisionHistory — don't have Supabase tables yet, so they stay
        // local-only (reset on refresh) until we build tables for them.
        const DB = {
            users: [],
            clients: [],
            campaigns: [],
            deliverables: [],
            stages: [],
            tasks: [],
            activity: [],
            notifications: [],
            clientDecisionHistory: []
        };

        async function loadAllData() {
            const [u, c, camp, d, s, t] = await Promise.all([
                sb.from('pmt_users').select('*'),
                sb.from('pmt_clients').select('*'),
                sb.from('pmt_campaigns').select('*'),
                sb.from('pmt_deliverables').select('*'),
                sb.from('pmt_stages').select('*').order('stage_order'),
                sb.from('pmt_tasks').select('*').order('task_order'),
            ]);

            DB.users = (u.data || []).map(x => ({
                id: x.id, name: x.name, role: x.role, dept: x.dept, avatar: x.avatar
            }));

            DB.clients = (c.data || []).map(x => ({
                id: x.id, name: x.name, contact: x.contact, status: x.status
            }));

            DB.campaigns = (camp.data || []).map(x => ({
                id: x.id, clientId: x.client_id, name: x.name, priority: x.priority,
                deadline: x.deadline, status: x.status
            }));

            DB.deliverables = (d.data || []).map(x => ({
                id: x.id, campaignId: x.campaign_id, name: x.name,
                type: x.type || 'Static Poster', clientRevision: 0,
                status: 'IN_PROGRESS', feedbackHistory: []
            }));

            DB.stages = (s.data || []).map(x => ({
                id: x.id, deliverableId: x.deliverable_id, name: x.name, dept: x.dept,
                order: x.stage_order, status: x.status, reworkPending: false
            }));

            DB.tasks = (t.data || []).map(x => ({
                id: x.id, stageId: x.stage_id, title: x.title, desc: x.description,
                assigneeId: x.assignee_id, deadline: x.deadline, status: x.status,
                clientRevision: null, order: x.task_order, isClientChange: false,
                createdAt: yesterday, startedAt: x.status !== 'TODO' ? now : null,
                iteration: x.iteration || 1, feedback: x.feedback, submissions: []
            }));
        }

        const WORKFLOW_TEMPLATES = {
            'Static Poster': [
                { name: 'Content Strategy', dept: 'Content' },
                { name: 'Visual Design', dept: 'Design' }
            ],
            'Instagram Carousel': [
                { name: 'Copywriting', dept: 'Content' },
                { name: 'Layout Design', dept: 'Design' }
            ],
            'Instagram Reel': [
                { name: 'Scripting', dept: 'Content' },
                { name: 'Storyboarding', dept: 'Design' },
                { name: 'Animation', dept: 'Animation' }
            ],
            'Presentation': [
                { name: 'Content Drafting', dept: 'Content' },
                { name: 'Slide Design', dept: 'Design' }
            ]
        };

        const AppState = {
            currentUser: DB.users[1],
            currentView: 'dashboard',
            activeCampaignId: null,
            activeDeliverableId: null,
            activeStageId: null,
            activeClientId: null,
            searchQuery: '',
            filterStatus: 'ALL'
        };

        function generateId(prefix) { return prefix + Math.random().toString(36).substr(2, 9); }
        function getUser(id) { return DB.users.find(u => u.id === id) || { name: 'Unassigned', avatar: 'https://ui-avatars.com/api/?name=U', dept: '' }; }
        function getClient(id) { return DB.clients.find(c => c.id === id); }
        function getCampaign(id) { return DB.campaigns.find(c => c.id === id); }
        function getDeliverable(id) { return DB.deliverables.find(d => d.id === id); }
        function getStage(id) { return DB.stages.find(s => s.id === id); }
        function getLatestSubmission(task) {
            return (task.submissions && task.submissions.length) ? task.submissions[task.submissions.length - 1] : null;
        }

        function logActivity(entityType, entityId, action, metadata = {}) {
            DB.activity.unshift({
                id: generateId('act'),
                entityType, entityId, action,
                actorId: AppState.currentUser.id,
                timestamp: new Date().toISOString(),
                metadata
            });
        }

        function createNotification(userId, type, message, actionCode) {
            // ALL means broadcast to everyone (simplified for prototype)
            if (userId === 'ALL') {
                DB.users.forEach(u => {
                    if (u.id !== AppState.currentUser.id) {
                        DB.notifications.unshift({ id: generateId('notif'), userId: u.id, type, message, actionCode, read: false, timestamp: new Date().toISOString() });
                    }
                });
            } else if (userId !== AppState.currentUser.id) {
                DB.notifications.unshift({ id: generateId('notif'), userId, type, message, actionCode, read: false, timestamp: new Date().toISOString() });
            }
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'success' ? '<i class="fa-solid fa-circle-check text-emerald-500"></i>' : '<i class="fa-solid fa-circle-exclamation text-red-500"></i>';
            const border = type === 'success' ? 'border-emerald-200' : 'border-red-200';
            toast.className = `toast-enter bg-white border ${border} shadow-lg rounded-xl p-4 flex items-center gap-3 w-max max-w-sm pointer-events-auto`;
            toast.innerHTML = `${icon} <span class="text-sm font-bold text-slate-700">${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.replace('toast-enter', 'toast-exit'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function showConfirmModal(title, message, confirmText, confirmClass, onConfirmStr) {
            const html = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden flex flex-col">
                        <div class="p-6 border-b border-slate-200">
                            <h2 class="text-xl font-bold text-slate-900">${title}</h2>
                            <p class="text-sm text-slate-500 mt-2">${message}</p>
                        </div>
                        <div class="p-6 bg-slate-50 flex justify-end gap-3">
                            <button onclick="closeConfirmModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-200 rounded-lg font-bold text-sm">Cancel</button>
                            <button onclick="${onConfirmStr}; closeConfirmModal()" class="px-4 py-2 text-white rounded-lg font-bold text-sm shadow-sm transition ${confirmClass}">${confirmText}</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('confirm-modals').innerHTML = html;
        }

        function closeModals() { document.getElementById('modals').innerHTML = ''; }
        function closeConfirmModal() { document.getElementById('confirm-modals').innerHTML = ''; }

        /** True once a Deliverable has any real work on it — a task that's
         *  moved past TODO, any submission, or a Client Revision already in
         *  progress. Used to decide whether its Type can still be changed. */
        function deliverableHasProductionHistory(deliverableId) {
            const deliv = getDeliverable(deliverableId);
            if (!deliv) return false;
            if (deliv.clientRevision > 0) return true;
            if ((deliv.feedbackHistory || []).length > 0) return true;
            const stageIds = DB.stages.filter(s => s.deliverableId === deliverableId).map(s => s.id);
            const tasks = DB.tasks.filter(t => stageIds.includes(t.stageId));
            return tasks.some(t => t.status !== 'TODO' || (t.submissions && t.submissions.length > 0));
        }
        /** Same idea at the Campaign level — true if any of its Deliverables
         *  have started real work. Used to lock the Campaign's Client field. */
        function campaignHasProductionHistory(campaignId) {
            const delivs = DB.deliverables.filter(d => d.campaignId === campaignId);
            return delivs.some(d => deliverableHasProductionHistory(d.id));
        }

        function recalculateStageGate(stage) {
            const deliv = getDeliverable(stage.deliverableId);
            const stageTasks = DB.tasks.filter(t => t.stageId === stage.id);
            
            // Current Revision logic: if clientRevision > 0, ONLY tasks explicitly 
            // tied to this revision cycle gate the stage. Historical tasks are ignored.
            let relevantTasks = [];
            if (deliv.clientRevision === 0) {
                relevantTasks = stageTasks;
            } else {
                relevantTasks = stageTasks.filter(t => t.isClientChange && t.clientRevision === deliv.clientRevision);
            }

            const allApproved = relevantTasks.length > 0 && relevantTasks.every(t => t.status === 'APPROVED');
            
            // P0 FIX — deadlock: reworkPending was being set true when Client
            // Changes were recorded, but nothing anywhere ever set it back to
            // false, and the gate above required !reworkPending to open. That
            // meant after the very first Client Change, this stage could
            // never reach CLIENT_DECISION again, no matter how many change
            // tasks got approved. reworkPending isn't an independent blocker —
            // it's just "are we still waiting on this revision's rework", which
            // is exactly what allApproved already answers. Clear it here, at
            // the moment it's actually resolved, instead of requiring it to
            // already be false as a precondition.
            if (allApproved && stage.status !== 'COMPLETED') {
                stage.reworkPending = false;
                stage.status = 'CLIENT_DECISION';
                deliv.status = 'CLIENT_REVIEW';
            }
        }

        function cascadeCompletion(stageId) {
            const stage = getStage(stageId);
            const deliv = getDeliverable(stage.deliverableId);
            const camp = getCampaign(deliv.campaignId);
            const delivStages = DB.stages.filter(s => s.deliverableId === deliv.id).sort((a,b)=>a.order - b.order);
            const currentIndex = delivStages.findIndex(s => s.id === stageId);
            
            stage.status = 'COMPLETED';
            logActivity('STAGE', stage.id, `Completed stage ${stage.name}`);

            if (currentIndex < delivStages.length - 1) {
                const nextStage = delivStages[currentIndex+1];
                nextStage.status = 'ACTIVE';
                deliv.status = 'IN_PROGRESS';
                logActivity('STAGE', nextStage.id, `Activated stage ${nextStage.name}`);
            } else {
                deliv.status = 'COMPLETED';
                logActivity('DELIVERABLE', deliv.id, `Completed deliverable ${deliv.name}`);
                
                // Check campaign completion
                const campDelivs = DB.deliverables.filter(d => d.campaignId === camp.id);
                if (campDelivs.every(d => d.status === 'COMPLETED')) {
                    camp.status = 'COMPLETED';
                    logActivity('CAMPAIGN', camp.id, `Completed campaign ${camp.name}`);
                }
            }
        }

        function stageGateInfo(stage) {
            const deliv = getDeliverable(stage.deliverableId);
            const allTasks = DB.tasks.filter(t => t.stageId === stage.id);
            const isRevisionCycle = deliv.clientRevision > 0;
            
            let relevant = [];
            if (!isRevisionCycle) {
                relevant = allTasks;
            } else {
                relevant = allTasks.filter(t => t.isClientChange && t.clientRevision === deliv.clientRevision);
            }

            return {
                deliv,
                isRevisionCycle,
                total: relevant.length,
                approved: relevant.filter(t => t.status === 'APPROVED').length,
                awaitingReview: relevant.filter(t => t.status === 'IN_REVIEW').length,
                inProgress: relevant.filter(t => t.status === 'IN_PROGRESS').length,
                changesRequired: relevant.filter(t => t.status === 'CHANGES_REQUIRED').length,
            };
        }

        function stageGateSupportingText(info) {
            if (info.awaitingReview > 0) return 'Review and approve all tasks before the deliverable can move to Client Decision.';
            if (info.inProgress > 0 || info.changesRequired > 0) return 'Complete and approve all tasks before the deliverable can move to Client Decision.';
            return 'Approve all tasks in this stage before the deliverable can move to Client Decision.';
        }
        function stageGateBreakdownLine(info) {
            const bits = [];
            if (info.awaitingReview > 0) bits.push(`${info.awaitingReview} task${info.awaitingReview > 1 ? 's' : ''} awaiting review`);
            if (info.inProgress > 0) bits.push(`${info.inProgress} task${info.inProgress > 1 ? 's' : ''} in progress`);
            if (info.changesRequired > 0) bits.push(`${info.changesRequired} task${info.changesRequired > 1 ? 's' : ''} need${info.changesRequired === 1 ? 's' : ''} rework`);
            return bits.join(' · ');
        }

        function feedbackDeptBadge(dept) {
            const colors = { 'Content': 'bg-indigo-50 text-indigo-700 border-indigo-200', 'Design': 'bg-blue-50 text-blue-700 border-blue-200', 'Animation': 'bg-amber-50 text-amber-700 border-amber-200' };
            const c = colors[dept] || 'bg-slate-50 text-slate-600 border-slate-200';
            return `<span class="px-2 py-0.5 rounded border text-[10px] font-bold uppercase tracking-wider ${c}">${dept}</span>`;
        }

        function getClientFeedbackOverview() {
            let feedback = [];
            DB.deliverables.forEach(d => {
                if (d.feedbackHistory && d.feedbackHistory.length > 0) {
                    const camp = getCampaign(d.campaignId);
                    const client = camp ? getClient(camp.clientId) : null;
                    d.feedbackHistory.forEach(f => {
                        const depts = [...new Set(DB.stages.filter(s => s.deliverableId === d.id).map(s => s.dept))];
                        feedback.push({
                            campaignId: d.campaignId,
                            deliverableId: d.id,
                            client: client ? client.name : 'Unknown Client',
                            campaign: camp ? camp.name : 'Unknown Campaign',
                            deliverable: d.name,
                            revision: f.clientRevision,
                            text: f.text,
                            author: f.author,
                            date: f.date,
                            departments: depts
                        });
                    });
                }
            });
            return feedback.reverse(); 
        }

        function getMyStats(userId) {
            const myTasks = DB.tasks.filter(t => t.assigneeId === userId);
            return {
                total: myTasks.length,
                approved: myTasks.filter(t => t.status === 'APPROVED').length,
                inReview: myTasks.filter(t => t.status === 'IN_REVIEW').length,
                changesReq: myTasks.filter(t => t.status === 'CHANGES_REQUIRED').length
            };
        }

        function getTaskPriority(taskId) {
            const task = DB.tasks.find(t => t.id === taskId);
            // Priority is only relevant for active work. Approved/history tasks lose priority highlighting.
            if (!task || task.status === 'APPROVED') return { label: '-', color: 'bg-slate-50 text-slate-400 border-slate-200' };
            
            // Only rank against other non-approved tasks in the same stage
            const activeTasks = DB.tasks.filter(t => t.stageId === task.stageId && t.status !== 'APPROVED').sort((a,b) => a.order - b.order);
            const index = activeTasks.findIndex(t => t.id === taskId);
            const total = activeTasks.length;
            
            if (index === -1) return { label: '-', color: 'bg-slate-50 text-slate-400 border-slate-200' };
            if (total === 1) return { label: 'High', color: 'bg-red-50 text-red-700 border-red-200' };
            
            const percentile = index / (total - 1);
            if (percentile === 0) return { label: 'Highest', color: 'bg-red-50 text-red-700 border-red-200' };
            if (percentile < 0.33) return { label: 'High', color: 'bg-orange-50 text-orange-700 border-orange-200' };
            if (percentile < 0.66) return { label: 'Medium', color: 'bg-amber-50 text-amber-700 border-amber-200' };
            if (percentile <= 1) return { label: 'Low', color: 'bg-slate-50 text-slate-600 border-slate-200' };
            return { label: 'Lowest', color: 'bg-slate-50 text-slate-600 border-slate-200' };
        }

        function getStageProgress(stageId) {
            const tasks = DB.tasks.filter(t => t.stageId === stageId);
            if (tasks.length === 0) return getStage(stageId).status === 'COMPLETED' ? 100 : 0;
            const approved = tasks.filter(t => t.status === 'APPROVED').length;
            return Math.round((approved / tasks.length) * 100);
        }

        /** clientRevision 0 means "no Client Change has happened yet" - the
         *  initial production pass isn't itself a revision, so it must never
         *  be shown to a user as "Revision 0". */
        function revisionLabel(n) {
            return n === 0 ? 'Initial Production' : `Revision ${n}`;
        }

        function getDeliverableProgress(delivId) {
            const stages = DB.stages.filter(s => s.deliverableId === delivId);
            if (stages.length === 0) return 0;
            const completed = stages.filter(s => s.status === 'COMPLETED').length;
            return Math.round((completed / stages.length) * 100);
        }

        /** Distinct from Overall Progress - this is scoped to only the work
         *  that matters RIGHT NOW. Before any Client Change, that's the
         *  active stage's own tasks. After one, it's strictly this
         *  revision's change tasks - historical (already-resolved) revisions
         *  never count here, even though their tasks stay APPROVED forever. */
        function getCurrentRevisionProgress(deliverableId) {
            const deliv = getDeliverable(deliverableId);
            const stages = DB.stages.filter(s => s.deliverableId === deliverableId).sort((a,b)=>a.order-b.order);

            if (deliv.clientRevision === 0) {
                const currentStage = stages.find(s => s.status === 'ACTIVE' || s.status === 'CLIENT_DECISION');
                if (!currentStage) return null;
                const tasks = DB.tasks.filter(t => t.stageId === currentStage.id);
                if (tasks.length === 0) return null;
                const approved = tasks.filter(t => t.status === 'APPROVED').length;
                return { label: 'Current Work', approved, total: tasks.length, suffix: 'tasks approved' };
            }

            const tasks = DB.tasks.filter(t => t.isClientChange && t.clientRevision === deliv.clientRevision);
            const approved = tasks.filter(t => t.status === 'APPROVED').length;
            return { label: `Revision ${deliv.clientRevision}`, approved, total: tasks.length, suffix: 'change tasks approved' };
        }

        function getCampaignProgress(campId) {
            const delivs = DB.deliverables.filter(d => d.campaignId === campId);
            if (delivs.length === 0) return 0;
            let totalProgress = 0;
            delivs.forEach(d => totalProgress += getDeliverableProgress(d.id));
            return Math.round(totalProgress / delivs.length);
        }

        function getActionNeededAdmin() {
            const todayStr = new Date().toISOString().split('T')[0];
            const items = [];
            
            const overdue = DB.tasks.filter(t => t.status !== 'APPROVED' && t.deadline < todayStr);
            if(overdue.length) {
                const link = overdue.length === 1 ? taskDeepLink(overdue[0].id) : `navigateTo('campaigns')`;
                items.push({ title: `${overdue.length} overdue task${overdue.length>1?'s':''}`, icon: 'fa-clock', color: 'text-red-600 bg-red-50', link });
            }
            
            const decisions = DB.stages.filter(s => s.status === 'CLIENT_DECISION');
            if(decisions.length) {
                const link = decisions.length === 1 ? `navigateTo('deliverable-detail', {deliverableId: '${getDeliverable(decisions[0].deliverableId).id}'})` : `navigateTo('approvals')`;
                items.push({ title: `${decisions.length} client decision${decisions.length>1?'s':''} pending`, icon: 'fa-handshake', color: 'text-blue-600 bg-blue-50', link });
            }

            const unassigned = DB.tasks.filter(t => !t.assigneeId || t.assigneeId === '');
            if(unassigned.length) {
                const link = unassigned.length === 1 ? taskDeepLink(unassigned[0].id) : `navigateTo('campaigns')`;
                items.push({ title: `${unassigned.length} unassigned task${unassigned.length>1?'s':''}`, icon: 'fa-user-plus', color: 'text-amber-600 bg-amber-50', link });
            }

            return items;
        }

        /** Navigates to a task's Deliverable Detail page and opens its Task
         *  Detail modal in one step - navigateTo() is synchronous, so this is
         *  safe to chain directly in a single inline handler. */
        function taskDeepLink(taskId) {
            const task = DB.tasks.find(t => t.id === taskId);
            const stage = getStage(task.stageId);
            const deliv = getDeliverable(stage.deliverableId);
            return `navigateTo('deliverable-detail', {deliverableId: '${deliv.id}', stageId: '${stage.id}'}); openTaskDetailModal('${task.id}')`;
        }

        function getActionNeededManager(dept) {

            const items = [];

                items.push({ title: `${inReview.length} task${inReview.length>1?'s':''} awaiting review`, icon: 'fa-eye', color: 'text-purple-600 bg-purple-50', link });
            }

            const decisions = DB.stages.filter(s => s.dept === dept && s.status === 'CLIENT_DECISION');
            if(decisions.length) {
                const link = decisions.length === 1 ? `navigateTo('deliverable-detail', {deliverableId: '${getDeliverable(decisions[0].deliverableId).id}'})` : `navigateTo('approvals')`;
                items.push({ title: `${decisions.length} client decision${decisions.length>1?'s':''} pending`, icon: 'fa-handshake', color: 'text-blue-600 bg-blue-50', link });
            }

            const overdue = deptTasks.filter(t => t.status !== 'APPROVED' && t.deadline < todayStr);
            if(overdue.length) {
                const link = overdue.length === 1 ? taskDeepLink(overdue[0].id) : `navigateTo('campaigns')`;
                items.push({ title: `${overdue.length} overdue task${overdue.length>1?'s':''}`, icon: 'fa-clock', color: 'text-red-600 bg-red-50', link });
            }

            return items;
        }

        function getActionNeededMember(userId) {

            const items = [];
            const myTasks = DB.tasks.filter(t => t.assigneeId === userId);

                items.push({ title: `${changes.length} change${changes.length>1?'s':''} required`, icon: 'fa-rotate-left', color: 'text-amber-600 bg-amber-50', link });
            }

            const dueToday = myTasks.filter(t => t.status !== 'APPROVED' && t.deadline === todayStr);
            if(dueToday.length) {
                const link = dueToday.length === 1 ? `navigateTo('member-board'); openTaskDetailModal('${dueToday[0].id}')` : `navigateTo('member-board')`;
                items.push({ title: `${dueToday.length} task${dueToday.length>1?'s':''} due today`, icon: 'fa-calendar-day', color: 'text-blue-600 bg-blue-50', link });
            }

                items.push({ title: `${awaitingReview.length} submitted, awaiting review`, icon: 'fa-hourglass-half', color: 'text-purple-600 bg-purple-50', link });

        }

        function renderActionNeeded(items) {
            if(!items.length) return `<div class="p-4 border border-slate-200 border-dashed rounded-xl text-center text-sm text-slate-500">No immediate action needed.</div>`;
            return `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                ${items.map(i => `

        }

        function getRealMetrics(dept = null) {
            let tasks = DB.tasks;
            if (dept) {
                const deptStageIds = DB.stages.filter(s => s.dept === dept).map(s => s.id);
                tasks = tasks.filter(t => deptStageIds.includes(t.stageId));
            }
            
            const approvedTasks = tasks.filter(t => t.status === 'APPROVED');
            const onTime = approvedTasks.filter(t => t.approvedAt && t.deadline && new Date(t.approvedAt) <= new Date(t.deadline + 'T23:59:59')).length;
            const onTimePct = approvedTasks.length ? Math.round((onTime / approvedTasks.length) * 100) : 100;

            const clientChangeTasks = tasks.filter(t => t.isClientChange);
            const reworkRate = tasks.length ? Math.round((clientChangeTasks.length / tasks.length) * 100) : 0;

            let totalReviewTime = 0;
            let reviewCount = 0;
            approvedTasks.forEach(t => {
                if(t.submittedAt && t.approvedAt) {
                    totalReviewTime += (new Date(t.approvedAt) - new Date(t.submittedAt));
                    reviewCount++;
                }
            });
            const avgReviewHrs = reviewCount ? Math.round(totalReviewTime / 3600000 / reviewCount) : 0;

            return { onTimePct, reworkRate, avgReviewHrs, totalTasks: tasks.length, openTasks: tasks.length - approvedTasks.length };
        }

        function getPipelineData(scopedTasks = DB.tasks) {
            const items = [
                { key: 'Content', label: 'Content', color: 'bg-indigo-600', text: 'text-indigo-600', count: 0, reviewTasks: [] },
                { key: 'Design', label: 'Design', color: 'bg-indigo-500', text: 'text-indigo-500', count: 0, reviewTasks: [] },
                { key: 'Animation', label: 'Animation', color: 'bg-amber-500', text: 'text-amber-600', count: 0, reviewTasks: [] },
                { key: 'Review', label: 'Review', color: 'bg-emerald-500', text: 'text-emerald-600', count: 0, reviewTasks: [] }
            ];

            scopedTasks.forEach(task => {
                const stage = getStage(task.stageId);
                if (!stage) return;
                if (task.status === 'IN_REVIEW') {
                    const review = items.find(x => x.key === 'Review');
                    if (review) { review.count++; review.reviewTasks.push(task); }
                    return;
                }
                const bucket = items.find(x => x.key === stage.dept);
                if (bucket) bucket.count++;
            });

            const total = items.reduce((sum, item) => sum + item.count, 0);
            return { items, total };
        }

        function renderPipelineBar(pipeline) {
            return `<div class="h-14 rounded-xl overflow-hidden flex bg-slate-100">
                ${pipeline.items.map(item => {
                    if (item.count === 0) return '';
                    const percentage = pipeline.total ? (item.count / pipeline.total) * 100 : 0;
                    const label = percentage >= 18 ? `${item.label} · ${item.count}` : `${item.count}`;
                    const reviewHandlers = item.key === 'Review'
                        ? `onmouseenter="showReviewPipelineTooltip(event)" onmousemove="moveReviewPipelineTooltip(event)" onmouseleave="hideReviewPipelineTooltip()"`
                        : '';
                    const cursor = item.key === 'Review' && item.reviewTasks.length ? 'cursor-help' : '';
                    return `<div class="${item.color} ${cursor} text-white flex items-center justify-center font-semibold text-sm transition-all hover:brightness-95 min-w-0 overflow-hidden whitespace-nowrap relative"
                                 style="width:${percentage}%"
                                 ${reviewHandlers}>
                                ${label}
                            </div>`;
                }).join('')}
            </div>`;
        }

        function getReviewTaskDetails() {
            return DB.tasks.filter(t => t.status === 'IN_REVIEW').map(task => {
                const stage = getStage(task.stageId);
                const deliverable = stage ? getDeliverable(stage.deliverableId) : null;
                const campaign = deliverable ? getCampaign(deliverable.campaignId) : null;
                const assignee = getUser(task.assigneeId);
                return {
                    campaign: campaign ? campaign.name : 'Unknown campaign',
                    deliverable: deliverable ? deliverable.name : 'Unknown deliverable',
                    deadline: task.deadline || 'No deadline',
                    member: assignee ? assignee.name : 'Unassigned'
                };
            });
        }

        function showReviewPipelineTooltip(event) {
            const tooltip = document.getElementById('pipeline-tooltip');
            if (!tooltip) return;
            const details = getReviewTaskDetails();
            if (!details.length) return;
            tooltip.innerHTML = `
                <div class="text-xs font-bold uppercase tracking-wider text-emerald-300 mb-3">Work to be reviewed</div>
                <div class="space-y-3">
                    ${details.map(d => `
                        <div class="border-b border-slate-700 pb-3 last:border-0 last:pb-0">
                            <div class="text-sm font-semibold text-white">${d.campaign}</div>

                            <div class="grid grid-cols-2 gap-2 mt-2 text-[11px]">
                                <div><span class="text-slate-500">Deadline</span><div class="text-slate-200 font-medium">${d.deadline}</div></div>
                                <div><span class="text-slate-500">Assigned to</span><div class="text-slate-200 font-medium">${d.member}</div></div>
                            </div>
                        </div>`).join('')}
                </div>`;
            tooltip.classList.remove('hidden');
            moveReviewPipelineTooltip(event);
        }

        function moveReviewPipelineTooltip(event) {
            const tooltip = document.getElementById('pipeline-tooltip');
            if (!tooltip || tooltip.classList.contains('hidden')) return;
            const gap = 14;
            const rect = tooltip.getBoundingClientRect();
            let left = event.clientX + gap;
            let top = event.clientY + gap;
            if (left + rect.width > window.innerWidth - 12) left = event.clientX - rect.width - gap;
            if (top + rect.height > window.innerHeight - 12) top = event.clientY - rect.height - gap;
            tooltip.style.left = `${Math.max(12, left)}px`;
            tooltip.style.top = `${Math.max(12, top)}px`;
        }

        function hideReviewPipelineTooltip() {
            const tooltip = document.getElementById('pipeline-tooltip');
            if (tooltip) tooltip.classList.add('hidden');
        }

            AppState.currentUser = DB.users.find(u => u.id === userId);

            AppState.activeCampaignId = null;
            AppState.activeDeliverableId = null;
            AppState.activeStageId = null;
            AppState.searchQuery = '';

            renderApp();

        function navigateTo(view, params = {}) {
            AppState.currentView = view;
            if (params.deliverableId) {
                AppState.activeDeliverableId = params.deliverableId;
                // Deliverable Detail's breadcrumb always needs a valid
                // Campaign context. Deriving it here means any caller that
                // only knows the deliverableId (deep-links, notifications)
                // can't accidentally leave activeCampaignId stale or unset.
                if (!params.campaignId) {
                    const deliv = getDeliverable(params.deliverableId);
                    if (deliv) AppState.activeCampaignId = deliv.campaignId;
                }
            }
            if (params.campaignId) AppState.activeCampaignId = params.campaignId;
            if (params.stageId) AppState.activeStageId = params.stageId;
            if (params.clientId) AppState.activeClientId = params.clientId;

            document.querySelector('header').outerHTML = renderTopNav();
            
            const sidebar = document.querySelector('aside');
            if(sidebar) sidebar.outerHTML = renderSidebar();

        function getDelayedTasks(scopedTasks = DB.tasks) {
            const today = new Date(); today.setHours(0,0,0,0);
            const terminal = new Set(['DONE','APPROVED','COMPLETED','CLIENT_APPROVED']);
            return scopedTasks.filter(task => {
                if (!task.deadline || terminal.has(task.status)) return false;
                return new Date(task.deadline + 'T00:00:00') < today;
            }).map(task => {
                const stage = getStage(task.stageId);
                const deliverable = stage ? getDeliverable(stage.deliverableId) : null;
                const campaign = deliverable ? getCampaign(deliverable.campaignId) : null;
                const assignee = getUser(task.assigneeId);
                const deadline = new Date(task.deadline + 'T00:00:00');
                return { task, stage, deliverable, campaign, assignee, daysOverdue: Math.max(1, Math.ceil((today - deadline)/86400000)) };
            }).sort((a,b) => b.daysOverdue - a.daysOverdue);
        }

        function renderDeliverableCard(deliv) {
            const stages = DB.stages.filter(s => s.deliverableId === deliv.id).sort((a,b)=>a.order-b.order);
            const progress = getDeliverableProgress(deliv.id);
            
            let allTasksCount = 0;
            let compTasksCount = 0;
            stages.forEach(s => {
                const sTasks = DB.tasks.filter(t => t.stageId === s.id);
                allTasksCount += sTasks.length;
                compTasksCount += sTasks.filter(t => t.status === 'APPROVED').length;
            });

            const pipelineHTML = stages.map((s, i) => {
                let icon = s.status === 'COMPLETED' ? '<i class="fa-solid fa-check-circle text-emerald-500"></i>' :
                           (s.status === 'ACTIVE' || s.status === 'CLIENT_DECISION') ? '<i class="fa-solid fa-dot-circle text-primary-500"></i>' :
                           '<i class="fa-regular fa-circle text-slate-300"></i>';
                return `
                    <div class="flex items-center gap-1.5 shrink-0" title="${s.name} (${s.dept})">
                        ${icon} <span class="text-xs font-medium text-slate-600 truncate max-w-[80px]">${s.dept}</span>
                    </div>
                    ${i < stages.length - 1 ? '<i class="fa-solid fa-chevron-right text-[10px] text-slate-300 shrink-0"></i>' : ''}
                `;
            }).join('');

            const currentStage = stages.find(s => s.status === 'ACTIVE' || s.status === 'CLIENT_DECISION');
            let actionNeededLabel = '';
            if (currentStage) {
                const gi = stageGateInfo(currentStage);
                if (currentStage.status === 'CLIENT_DECISION') actionNeededLabel = 'Client decision pending';
                else if (DB.tasks.some(t => t.stageId === currentStage.id && t.status === 'IN_REVIEW')) actionNeededLabel = 'Awaiting review';
                else if (currentStage.reworkPending && gi.total === 0) actionNeededLabel = 'Add change tasks';
            }

            return `
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition p-5 flex flex-col justify-between cursor-pointer group" onclick="navigateTo('deliverable-detail', {deliverableId: '${deliv.id}'})">

                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">${progress}%</span>

                            </div>
                        </div>
                        <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-2 no-scrollbar">
                            ${pipelineHTML}
                        </div>
                        ${currentStage ? `<div class="text-[11px] text-slate-500 font-medium mb-1">Current Stage: <span class="text-slate-700 font-bold">${currentStage.name}</span></div>` : ''}
                        ${(() => {
                            const rp = getCurrentRevisionProgress(deliv.id);
                            if (!rp || rp.total === 0 || deliv.clientRevision === 0) return '';
                            return `<div class="text-[11px] text-slate-500 font-medium mb-1">${rp.label}: <span class="text-slate-700 font-bold">${rp.approved} / ${rp.total} ${rp.suffix}</span></div>`;
                        })()}
                        ${actionNeededLabel ? `<div class="text-[11px] text-amber-700 font-bold mb-1"><i class="fa-solid fa-triangle-exclamation mr-1"></i>${actionNeededLabel}</div>` : ''}
                    </div>
                    <div class="mt-4 pt-4 border-t border-slate-100 flex justify-between items-center">
                        <div class="text-xs text-slate-500 font-medium">Tasks: <span class="text-slate-800">${compTasksCount}/${allTasksCount}</span></div>
                        <span class="text-sm font-semibold text-primary-600">Open <i class="fa-solid fa-arrow-right ml-1"></i></span>
                    </div>
                </div>

        function renderDeliverableDetail() {
            const deliv = getDeliverable(AppState.activeDeliverableId);
            if (!deliv) return `<div class="p-8">Deliverable not found.</div>`;
            const camp = getCampaign(deliv.campaignId);
            let stages = DB.stages.filter(s => s.deliverableId === deliv.id).sort((a,b)=>a.order-b.order);
            
            const isManager = AppState.currentUser.role === 'MANAGER';
            
            if (!AppState.activeStageId || !stages.find(s => s.id === AppState.activeStageId)) {
                if (isManager) {
                    const myStages = stages.filter(s => s.dept === AppState.currentUser.dept);
                    const myActive = myStages.find(s => s.status === 'ACTIVE');
                    const myClientDecision = myStages.find(s => s.status === 'CLIENT_DECISION');
                    // Most recent completed stage for this dept - highest order,
                    // since a dept could in principle own more than one stage.
                    const myCompleted = myStages.filter(s => s.status === 'COMPLETED').sort((a,b) => b.order - a.order)[0];
                    const myStage = myActive || myClientDecision || myCompleted;
                    AppState.activeStageId = myStage ? myStage.id : stages[0].id;
                } else {
                    const activeS = stages.find(s => s.status === 'ACTIVE' || s.status === 'CLIENT_DECISION') || stages[0];
                    AppState.activeStageId = activeS.id;
                }
            }

            const currentStage = getStage(AppState.activeStageId);
            const currentRev = deliv.clientRevision || 0;
            const progress = getDeliverableProgress(deliv.id);
            
            const isActiveChangeRequest = deliv.status === 'CHANGES_REQUESTED';
            const currentFeedback = isActiveChangeRequest ? (deliv.feedbackHistory || []).find(f => f.clientRevision === currentRev) : null;
            const historicalFeedback = (deliv.feedbackHistory || [])
                .filter(f => !currentFeedback || f.clientRevision !== currentFeedback.clientRevision)
                .sort((a,b)=>b.clientRevision - a.clientRevision);

            const feedbackHtml = currentFeedback ? `
                <div class="bg-amber-50 border border-amber-200 rounded-xl p-5 mb-6 shadow-sm">
                    <div class="flex items-center justify-between mb-3 border-b border-amber-200/50 pb-2">
                        <h3 class="text-sm font-bold text-amber-800 flex items-center gap-2"><i class="fa-solid fa-comment-dots text-amber-600"></i> Current Client Feedback</h3>
                        <span class="text-[10px] font-bold uppercase tracking-wider text-amber-700 bg-amber-200/50 px-2 py-0.5 rounded">Revision ${currentFeedback.clientRevision}</span>
                    </div>
                    <p class="text-amber-900 text-sm whitespace-pre-wrap leading-relaxed">"${currentFeedback.text}"</p>
                    <div class="text-xs font-medium text-amber-700/80 mt-4 pt-3 border-t border-amber-200/50 flex flex-wrap gap-3">
                        <span><i class="fa-solid fa-user mr-1"></i>Recorded by ${currentFeedback.author}</span>
                        <span><i class="fa-regular fa-calendar mr-1"></i>${currentFeedback.date}</span>
                    </div>
                </div>
            ` : '';

            const historyHtml = historicalFeedback.length > 0 ? `
                <details class="bg-white border border-slate-200 rounded-xl mb-6 shadow-sm group">
                    <summary class="px-5 py-4 font-bold text-slate-800 cursor-pointer list-none flex justify-between items-center select-none">
                        <span>Client Feedback History</span>
                        <i class="fa-solid fa-chevron-down text-slate-400 group-open:rotate-180 transition-transform"></i>
                    </summary>
                    <div class="p-5 pt-0 border-t border-slate-100 flex flex-col gap-4">
                        ${historicalFeedback.map(f => `
                            <div class="bg-slate-50 border border-slate-200 rounded-lg p-4">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider bg-slate-200 px-2 py-0.5 rounded">Revision ${f.clientRevision}</span>
                                    <span class="text-[10px] text-slate-400">${f.date}</span>
                                </div>
                                <p class="text-sm text-slate-600 whitespace-pre-wrap">"${f.text}"</p>
                            </div>
                        `).join('')}
                    </div>
                </details>
            ` : '';

            const decisionHistory = (DB.clientDecisionHistory || [])
                .filter(dh => dh.deliverableId === deliv.id)
                .sort((a, b) => new Date(b.recordedAt) - new Date(a.recordedAt));

            const decisionHistoryHtml = decisionHistory.length > 0 ? `
                <details class="bg-white border border-slate-200 rounded-xl mb-6 shadow-sm group">
                    <summary class="px-5 py-4 font-bold text-slate-800 cursor-pointer list-none flex justify-between items-center select-none">
                        <span>Client Decision History</span>
                        <i class="fa-solid fa-chevron-down text-slate-400 group-open:rotate-180 transition-transform"></i>
                    </summary>
                    <div class="p-5 pt-0 border-t border-slate-100 flex flex-col gap-3">
                        ${decisionHistory.map(dh => {
                            const recorder = getUser(dh.recordedBy);
                            const isApproved = dh.decision === 'APPROVED';
                            return `
                                <div class="border rounded-lg p-4 ${isApproved ? 'bg-emerald-50 border-emerald-200' : 'bg-amber-50 border-amber-200'}">
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="text-xs font-bold uppercase tracking-wider ${isApproved ? 'text-emerald-700' : 'text-amber-700'}">
                                            <i class="fa-solid ${isApproved ? 'fa-circle-check' : 'fa-rotate-left'} mr-1"></i>
                                            ${isApproved ? 'Client Approved' : 'Client Requested Changes'} — ${revisionLabel(dh.clientRevision)}
                                        </span>
                                        <span class="text-[10px] text-slate-400">${new Date(dh.recordedAt).toLocaleString()}</span>
                                    </div>
                                    <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs text-slate-600 mb-2">
                                        <div><span class="font-semibold text-slate-500">Channel:</span> ${dh.channel}</div>
                                        <div><span class="font-semibold text-slate-500">Contact:</span> ${dh.contactPerson || '—'}</div>
                                        <div><span class="font-semibold text-slate-500">Recorded by:</span> ${recorder ? recorder.name : 'Unknown'}</div>
                                    </div>
                                    ${dh.feedback ? `<p class="text-xs text-slate-700 whitespace-pre-wrap mt-2 pt-2 border-t border-slate-200/60"><span class="font-semibold">Feedback:</span> "${dh.feedback}"</p>` : ''}
                                    ${dh.notes ? `<p class="text-xs text-slate-500 whitespace-pre-wrap mt-2 pt-2 border-t border-slate-200/60"><span class="font-semibold">Notes:</span> ${dh.notes}</p>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </details>
            ` : '';

            const delivActivity = DB.activity.filter(a => a.entityId === deliv.id || DB.stages.some(s => s.deliverableId === deliv.id && s.id === a.entityId)).slice(0, 8);
            const delivActivityHtml = delivActivity.length ? `
                <details class="bg-white border border-slate-200 rounded-xl mb-6 shadow-sm group">
                    <summary class="px-5 py-4 font-bold text-slate-800 cursor-pointer list-none flex justify-between items-center select-none">
                        <span>Activity</span>
                        <i class="fa-solid fa-chevron-down text-slate-400 group-open:rotate-180 transition-transform"></i>
                    </summary>
                    <div class="p-5 pt-0 border-t border-slate-100 space-y-4">
                        ${delivActivity.map(a => `
                            <div class="flex gap-3 text-sm">
                                <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 shrink-0"><i class="fa-solid fa-history text-xs"></i></div>
                                <div>
                                    <div class="text-slate-700"><span class="font-semibold">${getUser(a.actorId)?.name.split(' ')[0] || 'Unknown'}</span> ${a.action}</div>
                                    <div class="text-[10px] text-slate-400 mt-0.5">${new Date(a.timestamp).toLocaleString()}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </details>
            ` : '';

            return `
                <div class="max-w-5xl mx-auto">
                    <!-- Deliverable Summary Header -->
                    <div class="bg-white border border-slate-200 rounded-xl p-5 mb-6 shadow-sm">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">${getClient(camp.clientId)?.name || 'Unknown'} • ${camp.name}</div>
                                <div class="flex items-center gap-3">
                                    <h2 class="text-2xl font-bold text-slate-900">${deliv.name}</h2>
                                    ${currentRev > 0 ? `<span class="text-[10px] font-bold uppercase tracking-wider text-slate-500 bg-slate-200 px-2.5 py-1 rounded">Revision ${currentRev}</span>` : ''}
                                </div>
                                <div class="text-xs text-slate-500 font-medium mt-1.5"><i class="fa-regular fa-calendar mr-1"></i>Deadline: ${camp.deadline}</div>
                            </div>
                            <div class="flex items-center gap-4 text-sm font-medium text-slate-600 shrink-0">
                                <div class="flex items-center gap-2">
                                    <div class="w-16 h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-emerald-500" style="width: ${progress}%"></div></div>
                                    ${progress}% Overall
                                </div>
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${deliv.status==='COMPLETED'?'bg-emerald-50 text-emerald-700 border border-emerald-200':deliv.status==='IN_PROGRESS'?'bg-blue-50 text-blue-700 border border-blue-200':deliv.status==='CHANGES_REQUESTED'?'bg-amber-50 text-amber-700 border border-amber-200':deliv.status==='CLIENT_REVIEW'?'bg-purple-50 text-purple-700 border border-purple-200':'bg-slate-100 text-slate-600 border border-slate-200'}">${deliv.status==='CHANGES_REQUESTED'?'CLIENT CHANGES':deliv.status.replace('_', ' ')}</span>
                            </div>
                        </div>
                        ${(() => {
                            const rp = getCurrentRevisionProgress(deliv.id);
                            if (!rp || rp.total === 0) return '';
                            return `<div class="mt-4 pt-4 border-t border-slate-100 flex items-center gap-2 text-sm">
                                <span class="font-bold text-slate-700">${rp.label}:</span>
                                <span class="text-slate-600 font-medium">${rp.approved} / ${rp.total} ${rp.suffix}</span>
                            </div>`;
                        })()}
                    </div>

                    ${feedbackHtml}
                    ${historyHtml}
                    ${decisionHistoryHtml}
                    ${delivActivityHtml}

                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 mb-6">
                        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4">Production Pipeline</h3>
                        <div class="flex items-center gap-2 overflow-x-auto pb-2">
                            ${stages.map((s, index) => {
                                const isMyDept = isManager && s.dept === AppState.currentUser.dept;
                                const isReadonly = isManager && !isMyDept;

                                let statusIcon = s.status === 'COMPLETED' ? '<i class="fa-solid fa-check text-emerald-500"></i>' : 
                                                 (s.status === 'ACTIVE' || s.status === 'CLIENT_DECISION') ? '<i class="fa-solid fa-spinner fa-spin text-primary-500"></i>' :
                                                 '<i class="fa-regular fa-circle text-slate-300"></i>';
                                
                                if (isReadonly) statusIcon = '<i class="fa-solid fa-lock text-slate-400"></i>';
                                
                                let borderClass = s.id === AppState.activeStageId ? 'border-primary-500 ring-1 ring-primary-500' : 'border-slate-200';
                                let bgClass = s.id === AppState.activeStageId ? 'bg-primary-50' : 'bg-white';
                                let opacityClass = (isReadonly && s.status === 'PENDING') ? 'opacity-60' : '';
                                
                                let clickAction = isReadonly ? '' : `onclick="AppState.activeStageId='${s.id}'; navigateTo('deliverable-detail')"`;
                                let cursorClass = isReadonly ? 'cursor-default' : 'cursor-pointer hover:border-primary-300';

                                let badge = '';
                                if (isMyDept) {
                                    badge = `<div class="mt-2 inline-block px-2 py-0.5 bg-primary-100 text-primary-700 text-[10px] font-bold rounded uppercase tracking-wider border border-primary-200">Your Stage</div>`;
                                } else if (isReadonly) {
                                    badge = `<div class="mt-2 inline-block px-2 py-0.5 bg-slate-100 text-slate-500 text-[10px] font-medium rounded uppercase tracking-wider flex items-center gap-1 w-max border border-slate-200"><i class="fa-solid fa-lock"></i> View Only</div>`;
                                }
                                
                                return `
                                    <div ${clickAction} class="flex-1 min-w-[200px] p-4 rounded-xl border-2 ${borderClass} ${bgClass} ${cursorClass} transition-all ${opacityClass}">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="text-xs font-bold text-slate-500 uppercase">Stage ${index+1}</span>
                                            ${statusIcon}
                                        </div>
                                        <div class="font-bold text-slate-800">${s.name}</div>
                                        <div class="text-xs text-slate-500 mt-1">${s.dept} Dept</div>
                                        ${badge}
                                    </div>
                                    ${index < stages.length - 1 ? '<i class="fa-solid fa-chevron-right text-slate-300"></i>' : ''}
                                `;
                            }).join('')}
                        </div>
                    </div>

                    ${deliv.status === 'COMPLETED' ? `
                        <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-10 text-center shadow-sm">
                            <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"><i class="fa-solid fa-check"></i></div>
                            <h3 class="text-emerald-800 font-bold text-xl mb-1">Deliverable Completed</h3>
                            <p class="text-emerald-600 text-sm mb-1">Client Approved</p>
                            <p class="text-emerald-700 font-bold text-lg mb-4">${progress}% Overall</p>
                            <p class="text-emerald-600 text-sm mb-6">All production stages are complete.</p>
                            <button onclick="document.getElementById('all-completed-tasks-container').classList.toggle('hidden')" class="px-5 py-2.5 bg-white border border-emerald-200 text-emerald-700 rounded-lg text-sm font-medium hover:bg-emerald-50 transition shadow-sm">View Completed Work</button>
                        </div>
                        <div id="all-completed-tasks-container" class="hidden pt-6">
                            ${stages.map(s => `
                                <div class="mb-6 last:mb-0">
                                    <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">${s.name} (${s.dept})</div>
                                    ${renderManagerTaskList(DB.tasks.filter(t => t.stageId === s.id), true)}
                                </div>
                            `).join('')}
                        </div>
                    ` : (currentStage ? renderStageDetail(currentStage) : '')}
                </div>
            `;
        }

        function renderStageDetail(stage) {
            const allTasks = DB.tasks.filter(t => t.stageId === stage.id);
            const isManager = AppState.currentUser.role === 'MANAGER';
            const isMyDept = isManager && AppState.currentUser.dept === stage.dept;
            const isAdmin = AppState.currentUser.role === 'ADMIN';
            const canManage = isAdmin || isMyDept;

            const totalTasks = allTasks.length;
            const approvedTasks = allTasks.filter(t => t.status === 'APPROVED').length;

            // A completed stage is a completed stage regardless of who's
            // looking at it or whether they'd otherwise be allowed to manage
            // it - ownership only matters for stages still in progress. This
            // check must come before the canManage branch below, or a
            // Manager viewing their OWN completed stage falls through into
            // the generic Gate 1 rendering purely because canManage is true.
            if (stage.status === 'COMPLETED') {
                return `
                    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-8 mb-6 text-center shadow-sm">
                        <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl"><i class="fa-solid fa-check"></i></div>
                        <h3 class="text-emerald-800 font-bold text-lg mb-1">Stage Completed</h3>
                        <p class="text-emerald-600 text-sm mb-4">Client Approved • ${stage.dept} Department</p>
                        <div class="text-sm font-medium text-emerald-700 mb-6">${approvedTasks} / ${totalTasks} tasks approved</div>
                        <button onclick="document.getElementById('completed-tasks-container').classList.toggle('hidden')" class="px-5 py-2.5 bg-white border border-emerald-200 text-emerald-700 rounded-lg text-sm font-medium hover:bg-emerald-50 transition shadow-sm">View Completed Tasks</button>
                    </div>
                    <div id="completed-tasks-container" class="hidden pb-8">
                        ${renderManagerTaskList(allTasks, true)}
                    </div>
                `;
            }
            
            if (!canManage || stage.status === 'PENDING') {
                if (stage.status === 'PENDING') {
                    return `
                        <div class="bg-slate-50 border border-slate-200 rounded-xl p-10 text-center shadow-sm">
                            <div class="w-12 h-12 bg-slate-200 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3 text-xl"><i class="fa-solid fa-lock"></i></div>
                            <h3 class="text-slate-700 font-bold text-lg mb-1">Waiting for previous stage</h3>
                            <p class="text-slate-500 text-sm mt-1">This stage cannot begin until the preceding stage is Client Approved.</p>
                        </div>
                    `;
                } else {
                    return `
                        <div class="bg-slate-50 border border-slate-200 rounded-xl p-8 text-center mb-6 shadow-sm">
                            <div class="w-12 h-12 bg-slate-200 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3 text-xl"><i class="fa-solid fa-lock"></i></div>
                            <h3 class="text-slate-700 font-bold text-lg mb-1">${stage.name}</h3>
                            <p class="text-slate-500 text-sm mb-6">🔒 Managed by ${stage.dept} Department • ${stage.status.replace('_', ' ')}</p>
                            <div class="text-left bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
                                <h4 class="font-semibold text-slate-700 text-sm mb-3 border-b border-slate-100 pb-2">Task Overview</h4>
                                ${renderManagerTaskList(allTasks, true)}
                            </div>
                        </div>
                    `;
                }
            }

            let stageAlert = '';
            const gi = stageGateInfo(stage);

            if (stage.status === 'CLIENT_DECISION') {
                const countLabel = gi.isRevisionCycle
                    ? `${gi.approved} / ${gi.total} change tasks approved`
                    : `${gi.approved} / ${gi.total} tasks approved`;
                const supporting = gi.isRevisionCycle
                    ? 'All required changes are approved. Confirm the updated deliverable with the client.'
                    : 'All internal tasks are approved. Confirm decision with the client.';
                stageAlert = `
                    <div class="bg-blue-50 border border-blue-200 rounded-xl p-5 mb-6 shadow-sm">
                        <div class="flex justify-between items-start gap-4 flex-wrap">
                            <div>
                                <div class="text-sm font-bold text-blue-700 mb-1">Gate 2 · Deliverable Review</div>
                                <h4 class="text-blue-900 font-bold flex items-center gap-2 text-xl"><i class="fa-solid fa-shield-check"></i> Ready for Client Decision</h4>
                                ${gi.isRevisionCycle ? `<div class="text-xs font-bold text-blue-700 mt-1.5">Revision ${gi.deliv.clientRevision}</div>` : ''}
                                <p class="text-blue-900 text-sm mt-2 font-bold">${countLabel}</p>
                                <p class="text-blue-800 text-sm mt-1">${supporting}</p>
                            </div>
                            <div class="flex gap-2 shrink-0">
                                ${AppState.currentUser.role === 'ADMIN' ? `
                                    <button onclick="openRecordClientChangesModal('${stage.id}')" class="px-4 py-2 bg-white text-blue-900 border border-blue-300 rounded shadow-sm text-sm font-semibold hover:bg-blue-100 transition whitespace-nowrap">Client Requested Changes</button>
                                    <button onclick="openRecordClientApprovalModal('${stage.id}')" class="px-4 py-2 bg-emerald-600 text-white rounded shadow-sm text-sm font-semibold hover:bg-emerald-700 transition whitespace-nowrap">Client Approved</button>
                                ` : `
                                    <span class="px-3 py-2 rounded-lg bg-emerald-50 border border-emerald-200 text-xs font-semibold text-emerald-700">Sent to Admin for client approval</span>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            } else if (stage.reworkPending) {
                const noChangeTasksYet = gi.total === 0;
                stageAlert = `
                    <div class="bg-amber-50 border border-amber-200 rounded-xl p-5 mb-6 shadow-sm">
                        <div class="flex justify-between items-start gap-4 flex-wrap">
                            <div>
                                <div class="text-sm font-bold text-amber-700 mb-1">Client Changes Requested</div>
                                <h4 class="text-amber-900 font-bold flex items-center gap-2 text-lg"><i class="fa-solid fa-triangle-exclamation"></i> Revision ${gi.deliv.clientRevision}</h4>
                                ${noChangeTasksYet ? `
                                    <p class="text-amber-800 text-sm mt-2">Client feedback has been recorded. Add the required change tasks to continue.</p>
                                    <p class="text-amber-900 text-sm mt-2 font-bold">Change Tasks: 0</p>
                                ` : `
                                    <p class="text-amber-900 text-sm mt-2 font-bold">${gi.approved} / ${gi.total} change tasks approved</p>
                                    ${stageGateBreakdownLine(gi) ? `<p class="text-amber-700 text-xs mt-1">${stageGateBreakdownLine(gi)}</p>` : ''}
                                    <p class="text-amber-800 text-sm mt-2">Complete and approve all change tasks before returning the deliverable to Client Decision.</p>
                                `}
                            </div>
                            <button onclick="openCreateChangeTasksModal('${stage.id}')" class="px-4 py-2.5 bg-amber-600 text-white rounded-lg shadow-sm text-sm font-bold hover:bg-amber-700 transition shrink-0 whitespace-nowrap"><i class="fa-solid fa-plus mr-1.5"></i>Add Change Task</button>
                        </div>
                    </div>
                `;
            } else {
                stageAlert = `
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 mb-6 shadow-sm">
                        <div class="text-sm font-bold text-slate-500 mb-1">Gate 1 · Internal Approval</div>
                        <h4 class="text-slate-700 font-bold flex items-center gap-2 text-lg"><i class="fa-solid fa-lock"></i> Client Decision Locked</h4>
                        <p class="text-slate-800 text-sm mt-2 font-bold">${gi.approved} / ${gi.total} tasks approved</p>
                        ${stageGateBreakdownLine(gi) ? `<p class="text-slate-500 text-xs mt-1">${stageGateBreakdownLine(gi)}</p>` : ''}
                        <p class="text-slate-500 text-sm mt-2">${stageGateSupportingText(gi)}</p>
                    </div>
                `;
            }

            const currentWork = allTasks.filter(t => t.status !== 'APPROVED');
            const historyWork = allTasks.filter(t => t.status === 'APPROVED');

            // Group History by Client Revision - most recent first, with
            // plain (non-client-change) work bucketed as "Original Production"
            // at the end, since it always predates any revision.
            const historyGroups = new Map();
            historyWork.forEach(t => {
                const key = (t.isClientChange && t.clientRevision) ? t.clientRevision : 'ORIGINAL';
                if (!historyGroups.has(key)) historyGroups.set(key, []);
                historyGroups.get(key).push(t);
            });
            const sortedGroupKeys = [...historyGroups.keys()].sort((a, b) => {
                if (a === 'ORIGINAL') return 1;
                if (b === 'ORIGINAL') return -1;
                return b - a;
            });

            return `
                <div>
                    ${stageAlert}
                    
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">Current Work</h3>
                            <p class="text-sm text-slate-500 mt-0.5">${gi.isRevisionCycle ? `Revision ${gi.deliv.clientRevision} — active change tasks` : 'Active tasks in the queue'}</p>
                        </div>
                        <button onclick="openAddTaskModal('${stage.id}')" class="bg-brand text-white px-4 py-2 rounded shadow-sm text-sm font-medium hover:bg-brand/90 transition"><i class="fa-solid fa-plus mr-2"></i>Add Task</button>
                    </div>
                    ${renderManagerTaskList(currentWork, false)}

                    ${historyWork.length > 0 ? `
                        <div class="mt-8 pt-8 border-t border-slate-200">
                            <h3 class="text-lg font-bold text-slate-800 mb-4">History</h3>
                            ${sortedGroupKeys.map(key => `
                                <div class="mb-6 last:mb-0">
                                    <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">${key === 'ORIGINAL' ? 'Original Production' : `Revision ${key}`}</div>
                                    ${renderManagerTaskList(historyGroups.get(key), true)}
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        let draggedMgrTaskId = null;
        function mgrDragStart(ev, taskId) { draggedMgrTaskId = taskId; ev.dataTransfer.effectAllowed = 'move'; setTimeout(() => { ev.target.classList.add('task-strip-dragging'); }, 0); }
        function mgrDragEnd(ev) { ev.target.classList.remove('task-strip-dragging'); draggedMgrTaskId = null; document.querySelectorAll('.task-strip').forEach(el => el.classList.remove('task-strip-over')); }
        function mgrDragOver(ev, el) { ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; if(draggedMgrTaskId && el.getAttribute('data-task-id') !== draggedMgrTaskId) { el.classList.add('task-strip-over'); } }
        function mgrDragLeave(ev, el) { el.classList.remove('task-strip-over'); }
        function mgrDrop(ev, targetTaskId, el) {
            ev.preventDefault();
            el.classList.remove('task-strip-over');
            if (!draggedMgrTaskId || draggedMgrTaskId === targetTaskId) return;
            const task = DB.tasks.find(t => t.id === draggedMgrTaskId);
            const stage = getStage(task.stageId);
            const role = AppState.currentUser.role;
            if (role !== 'MANAGER' && role !== 'ADMIN') return;
            if (role === 'MANAGER' && stage.dept !== AppState.currentUser.dept) return;
            const stageTasks = DB.tasks.filter(t => t.stageId === task.stageId && t.status !== 'APPROVED' && t.status !== 'IN_REVIEW').sort((a,b) => a.order - b.order);
            const draggedIdx = stageTasks.findIndex(t => t.id === draggedMgrTaskId);
            const targetIdx = stageTasks.findIndex(t => t.id === targetTaskId);
            if(draggedIdx === -1 || targetIdx === -1) return;
            const [draggedTask] = stageTasks.splice(draggedIdx, 1);
            stageTasks.splice(targetIdx, 0, draggedTask);
            stageTasks.forEach((t, i) => t.order = i + 1);
            showToast('Task order updated');
            navigateTo(AppState.currentView);
        }

        function renderManagerTaskList(tasks, readOnly = false) {
            if(tasks.length === 0) return `<div class="p-8 text-center bg-white border border-slate-200 border-dashed rounded-xl text-slate-500 font-medium shadow-sm">No tasks in this list.</div>`;
            const sortedTasks = tasks.sort((a, b) => a.order - b.order);
            return `<div class="flex flex-col gap-2" id="manager-task-list">
                    ${sortedTasks.map((t, i) => renderManagerTaskStrip(t, i + 1, readOnly)).join('')}
                </div>`;
        }

        function renderManagerTaskStrip(task, orderNum, readOnly = false) {
            const assignee = getUser(task.assigneeId);
            const prio = getTaskPriority(task.id);
            const statusLabels = { 'TODO': 'To Do', 'IN_PROGRESS': 'In Progress', 'IN_REVIEW': 'In Review', 'CHANGES_REQUIRED': 'Changes Req', 'APPROVED': 'Approved' };
            // A task under review is locked independently of readOnly (which
            // is a whole-list historical flag) — core metadata and ordering
            // must not change out from under the Member while it's being
            // reviewed. It's still part of the live list, just not editable.
            const reviewLocked = !readOnly && task.status === 'IN_REVIEW';
            const dragAttrs = (readOnly || reviewLocked) ? '' : `draggable="true" ondragstart="mgrDragStart(event, '${task.id}')" ondragend="mgrDragEnd(event)" ondragover="mgrDragOver(event, this)" ondragleave="mgrDragLeave(event, this)" ondrop="mgrDrop(event, '${task.id}', this)"`;
            const cursorClass = (readOnly || reviewLocked) ? '' : 'cursor-grab active:cursor-grabbing hover:border-slate-300';
            const opacityClass = readOnly ? 'opacity-70 bg-slate-50' : 'bg-white';

            return `
                <div class="task-strip group flex items-center border border-slate-200 rounded-xl p-3 shadow-sm relative ${cursorClass} ${opacityClass}" ${dragAttrs} data-task-id="${task.id}">
                    <div class="flex items-center justify-center gap-3 w-10 shrink-0 text-slate-300 ${readOnly ? '' : 'group-hover:text-slate-500'} transition-colors">
